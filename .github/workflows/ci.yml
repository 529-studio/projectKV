name: CI - Code Verification

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify and Test Go Backend
        run: |
          cd services/go-server
          go vet ./...
          go test -v ./...
          go build -v -o bin/server ./cmd/server

      - name: Verify Web Frontend (Next.js)
        run: |
          cd apps/web
          npm install
          npm run build
      
      - name: Verify Tools Syntax
        run: |
          node --check tools/crawler/get_all_cameras.js

      - name: Verify Camera Dataset Integrity
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('cameras_all.json', 'utf8'));
            console.log('Total valid cameras count:', data.length);
            if (!Array.isArray(data) || data.length === 0) process.exit(1);
          "
