name: CI - Code Verification

on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - '.githooks/**'
      - '.github/workflows/auto-request-reviewers.yml'
      - '.github/workflows/branch-guard.yml'
      - '.github/workflows/docker-publish.yml'
      - '.env.example'
      - '.env.stg.example'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      model: ${{ steps.filter.outputs.model }}
      tools_dataset: ${{ steps.filter.outputs.tools_dataset }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'services/go-server/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'
            model:
              - 'services/cv-engine/**'
              - '.github/workflows/ci.yml'
            tools_dataset:
              - 'tools/**'
              - 'cameras_all.json'
              - 'cameras_enriched.json'
              - 'h3_hex_polygons.json'
              - '.github/workflows/ci.yml'

  verify-backend:
    name: Verify Go Backend
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'services/go-server/go.mod'
          cache-dependency-path: 'services/go-server/go.sum'

      - name: Lint Go Backend
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: services/go-server
          install-mode: "goinstall"
          verify: false

      - name: Verify and Test Go Backend
        run: |
          cd services/go-server
          go vet ./...
          go test -v ./... -race -cover
          go build -v ./...

  verify-frontend:
    name: Verify Web Frontend
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Verify Web Frontend (Next.js)
        run: |
          cd apps/web
          npm ci || npm install
          npm run lint
          npm test
          npm run build

  verify-tools-dataset:
    name: Verify Tools & Dataset Integrity
    needs: detect-changes
    if: needs.detect-changes.outputs.tools_dataset == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Tools Syntax
        run: |
          node --check tools/crawler/get_all_cameras.js

      - name: Verify Camera Dataset Integrity
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('cameras_all.json', 'utf8'));
            console.log('Total valid cameras count:', data.length);
            if (!Array.isArray(data) || data.length === 0) process.exit(1);
          "

  verify-model:
    name: Verify CV Engine (Python)
    needs: detect-changes
    if: needs.detect-changes.outputs.model == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Test Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install numpy pillow

      - name: Run CV Engine Unit Tests
        run: |
          cd services/cv-engine
          python3 -m unittest discover -s . -p "test_*.py"

