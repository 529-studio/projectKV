name: CI - Code Verification

on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - '.githooks/**'
      - '.github/workflows/auto-request-reviewers.yml'
      - '.github/workflows/branch-guard.yml'
      - '.github/workflows/docker-publish.yml'
      - '.env.example'
      - '.env.stg.example'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  detect-changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      model: ${{ steps.filter.outputs.model }}
      tools_dataset: ${{ steps.filter.outputs.tools_dataset }}
      target_runner: ${{ steps.probe-runner.outputs.target_runner }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'services/go-server/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'
            model:
              - 'services/cv-engine/**'
              - '.github/workflows/ci.yml'
            tools_dataset:
              - 'tools/**'
              - 'cameras_all.json'
              - 'cameras_enriched.json'
              - 'h3_hex_polygons.json'
              - '.github/workflows/ci.yml'

      - name: Probe Self-Hosted Runner Status
        id: probe-runner
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ACTIONS_RUNNER_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            try {
              const res = await github.rest.actions.listSelfHostedRunnersForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              const runner = res.data.runners.find(r => 
                r.status === 'online' && 
                r.labels.some(l => l.name === 'dev-box')
              );
              if (runner) {
                core.info(`[OK] Self-hosted runner '${runner.name}' is ONLINE. Routing to dev-box.`);
                core.setOutput('target_runner', JSON.stringify(['self-hosted', 'dev-box']));
              } else {
                core.warning(`[WARN] dev-box runner is OFFLINE. Fallback to ubuntu-latest.`);
                core.setOutput('target_runner', JSON.stringify(['ubuntu-latest']));
              }
            } catch (err) {
              core.warning(`[WARN] Failed to query runner status: ${err.message}. Defaulting to ubuntu-latest.`);
              core.setOutput('target_runner', JSON.stringify(['ubuntu-latest']));
            }

  verify-backend:
    name: Verify Go Backend
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ${{ fromJSON(needs.detect-changes.outputs.target_runner) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'services/go-server/go.mod'
          cache-dependency-path: 'services/go-server/go.sum'

      - name: Verify and Test Go Backend
        run: |
          cd services/go-server
          go vet ./...
          go test -v ./... -race -cover
          go build -v ./...

  verify-frontend:
    name: Verify Web Frontend
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ${{ fromJSON(needs.detect-changes.outputs.target_runner) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Verify Web Frontend (Next.js)
        run: |
          cd apps/web
          npm ci || npm install
          npm run lint
          npm test
          npm run build

  verify-tools-dataset:
    name: Verify Tools & Dataset Integrity
    needs: detect-changes
    if: needs.detect-changes.outputs.tools_dataset == 'true'
    runs-on: ${{ fromJSON(needs.detect-changes.outputs.target_runner) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Tools Syntax
        run: |
          node --check tools/crawler/get_all_cameras.js

      - name: Verify Camera Dataset Integrity
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('cameras_all.json', 'utf8'));
            console.log('Total valid cameras count:', data.length);
            if (!Array.isArray(data) || data.length === 0) process.exit(1);
          "

  verify-model:
    name: Verify CV Engine (Python)
    needs: detect-changes
    if: needs.detect-changes.outputs.model == 'true'
    runs-on: ${{ fromJSON(needs.detect-changes.outputs.target_runner) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Test Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install --break-system-packages numpy pillow 2>/dev/null || pip install numpy pillow

      - name: Run CV Engine Unit Tests
        run: |
          cd services/cv-engine
          python3 -m unittest discover -s . -p "test_*.py"

