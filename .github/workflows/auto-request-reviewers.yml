name: Auto Request Reviewers

on:
  pull_request:
    types: [opened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-request-reviewers:
    name: Auto Request Reviewers
    runs-on: ubuntu-latest
    steps:
      - name: Request Dynamic Reviewers
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const prAuthor = pr.user.login;

            console.log(`Evaluating PR #${pr.number} (Author: @${prAuthor}, Draft: ${pr.draft})`);

            // 1. Skip if PR is currently in draft state
            if (pr.draft) {
              console.log('PR is currently in draft mode. Skipping review request.');
              return;
            }

            // 2. Query repository contributors dynamically
            let contributors = [];
            try {
              const res = await github.rest.repos.listContributors({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });
              contributors = res.data;
            } catch (err) {
              console.error(`Failed to fetch contributors: ${err.message}`);
              throw err;
            }

            // 3. Filter human contributors (exclude bots and accounts ending in [bot])
            const humanContributors = contributors
              .filter(c => c.type === 'User' && !c.login.endsWith('[bot]'))
              .map(c => c.login);

            console.log(`Discovered ${humanContributors.length} human contributor(s): ${humanContributors.join(', ')}`);

            // 4. Select target reviewers
            let targetReviewers = [];
            const isBotAuthor = pr.user.type === 'Bot' || prAuthor.endsWith('[bot]') || prAuthor === 'app/dependabot';

            if (isBotAuthor) {
              // If PR was authored by a bot (e.g. Dependabot), request review from all human contributors
              targetReviewers = humanContributors;
            } else {
              // If PR was authored by a human, exclude the author (prevent 422 self-review error)
              targetReviewers = humanContributors.filter(login => login !== prAuthor);
            }

            if (targetReviewers.length === 0) {
              console.log('No eligible reviewers available to request.');
              return;
            }

            console.log(`Requesting reviews from: ${targetReviewers.map(r => '@' + r).join(', ')}`);

            // 5. Request reviewers via GitHub API
            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                reviewers: targetReviewers
              });
              console.log(`✓ Successfully requested review from: ${targetReviewers.join(', ')}`);
            } catch (err) {
              console.error(`Error requesting reviewers: ${err.message}`);
              throw err;
            }
