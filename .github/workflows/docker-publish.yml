name: Docker Build, Publish and Deploy

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - '.githooks/**'
      - '.github/workflows/auto-request-reviewers.yml'
      - '.github/workflows/branch-guard.yml'
      - '.github/workflows/ci.yml'
      - '.env.example'
      - '.env.stg.example'
  workflow_dispatch:
    inputs:
      custom_tag:
        description: "Optional custom image tag"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 0: Detect Changed Components
  # ────────────────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      model: ${{ steps.filter.outputs.model }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'services/go-server/**'
              - 'cameras_all.json'
              - 'cameras_enriched.json'
              - 'h3_hex_polygons.json'
              - 'docker-compose.stg.yml'
              - '.github/workflows/docker-publish.yml'
            frontend:
              - 'apps/web/**'
              - 'docker-compose.stg.yml'
              - '.github/workflows/docker-publish.yml'
            model:
              - 'services/cv-engine/**'
              - 'docker-compose.cv.yml'
              - '.github/workflows/docker-publish.yml'

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1A: Build & Push Go Backend Service
  # ────────────────────────────────────────────────────────────────────────────
  build-backend:
    name: Build & Push Backend Image
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Image Tags
        id: meta
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend" | tr '[:upper:]' '[:lower:]')
          LEGACY_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          TAGS="${IMAGE_LOWER}:${{ github.sha }},${LEGACY_LOWER}:${{ github.sha }}"

          if [ "${{ github.ref_name }}" = "dev" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:dev,${IMAGE_LOWER}:stg-latest,${IMAGE_LOWER}:latest,${LEGACY_LOWER}:dev,${LEGACY_LOWER}:stg-latest,${LEGACY_LOWER}:latest"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:latest,${LEGACY_LOWER}:latest"
          fi

          if [ -n "${{ inputs.custom_tag }}" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:${{ inputs.custom_tag }},${LEGACY_LOWER}:${{ inputs.custom_tag }}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/go-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1B: Build & Push Web Frontend Service (Nginx)
  # ────────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build & Push Frontend Image
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Image Tags
        id: meta
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend" | tr '[:upper:]' '[:lower:]')
          TAGS="${IMAGE_LOWER}:${{ github.sha }}"

          if [ "${{ github.ref_name }}" = "dev" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:dev,${IMAGE_LOWER}:stg-latest,${IMAGE_LOWER}:latest"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:latest"
          fi

          if [ -n "${{ inputs.custom_tag }}" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:${{ inputs.custom_tag }}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1C: Build & Push Model Service (OpenVINO CV Engine)
  # ────────────────────────────────────────────────────────────────────────────
  build-model:
    name: Build & Push Model Image
    needs: detect-changes
    if: needs.detect-changes.outputs.model == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Image Tags
        id: meta
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-model" | tr '[:upper:]' '[:lower:]')
          TAGS="${IMAGE_LOWER}:${{ github.sha }}"

          if [ "${{ github.ref_name }}" = "dev" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:dev,${IMAGE_LOWER}:stg-latest,${IMAGE_LOWER}:latest"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:latest"
          fi

          if [ -n "${{ inputs.custom_tag }}" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:${{ inputs.custom_tag }}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Model Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/cv-engine/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=model
          cache-to: type=gha,mode=max,scope=model

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Deploy via Portainer
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy via Portainer
    runs-on: ubuntu-latest
    needs: [detect-changes, build-backend, build-frontend, build-model]
    if: |
      always() &&
      (github.event_name == 'push' && github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch') &&
      needs.build-backend.result != 'failure' && needs.build-backend.result != 'cancelled' &&
      needs.build-frontend.result != 'failure' && needs.build-frontend.result != 'cancelled' &&
      needs.build-model.result != 'failure' && needs.build-model.result != 'cancelled' &&
      (needs.build-backend.result == 'success' || needs.build-frontend.result == 'success' || needs.build-model.result == 'success')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Portainer Redeploy
        run: |
          if [ -z "${{ secrets.PORTAINER_API_KEY }}" ]; then
            echo "PORTAINER_API_KEY is not set — skipping deploy trigger."
            exit 0
          fi
          PORTAINER_URL="https://REDACTED_ADMIN_HOST"
          PORTAINER_KEY="${{ secrets.PORTAINER_API_KEY }}"
          CF_CLIENT_ID="${{ secrets.CF_ACCESS_CLIENT_ID }}"
          CF_CLIENT_SECRET="${{ secrets.CF_ACCESS_CLIENT_SECRET }}"

          # Step A: Redeploy App Stack 14 on edge host (Endpoint 3)
          if [ "${{ needs.detect-changes.outputs.backend }}" = "true" ] || [ "${{ needs.detect-changes.outputs.frontend }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Triggering Portainer Stack 14 (App on edge host, endpoint 3)..."
            STACK_RES=$(curl -sS -f -X GET "${PORTAINER_URL}/api/stacks/14" \
              -H "X-API-Key: ${PORTAINER_KEY}" \
              -H "CF-Access-Client-Id: ${CF_CLIENT_ID}" \
              -H "CF-Access-Client-Secret: ${CF_CLIENT_SECRET}" \
              -H "User-Agent: Mozilla/5.0")

            STACK_FILE=$(cat docker-compose.stg.yml)
            ENV_JSON=$(echo "$STACK_RES" | jq 'if .Env then (.Env | map(if .name == "CV_ENGINE_URL" then .value = "http://REDACTED_PRIVATE_MESH_IP:8000" else . end)) else [] end')

            PAYLOAD=$(jq -n \
              --arg file "$STACK_FILE" \
              --argjson env "$ENV_JSON" \
              '{stackFileContent: $file, env: $env, prune: true, pullImage: true}')

            curl -sS -f -o /dev/null -X PUT "${PORTAINER_URL}/api/stacks/14?endpointId=3" \
              -H "X-API-Key: ${PORTAINER_KEY}" \
              -H "CF-Access-Client-Id: ${CF_CLIENT_ID}" \
              -H "CF-Access-Client-Secret: ${CF_CLIENT_SECRET}" \
              -H "Content-Type: application/json" \
              -H "User-Agent: Mozilla/5.0" \
              -d "$PAYLOAD"

            echo "Stack 14 (App on edge host) redeployed successfully."
          fi

          # Step B: Redeploy CV Model Stack 17 on inference worker (Endpoint 4)
          if [ "${{ needs.detect-changes.outputs.model }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Checking inference worker (endpoint 4) availability..."
            DEVBOX_STATUS=$(curl -sS -m 8 "${PORTAINER_URL}/api/endpoints/4" \
              -H "X-API-Key: ${PORTAINER_KEY}" \
              -H "CF-Access-Client-Id: ${CF_CLIENT_ID}" \
              -H "CF-Access-Client-Secret: ${CF_CLIENT_SECRET}" \
              -H "User-Agent: Mozilla/5.0" | jq -r '.Status // 2' 2>/dev/null || echo "2")

            if [ "$DEVBOX_STATUS" = "1" ]; then
              echo "inference worker is online. Triggering Portainer Stack 17 (CV Engine on inference worker, endpoint 4)..."
              STACK_RES=$(curl -sS -f -X GET "${PORTAINER_URL}/api/stacks/17" \
                -H "X-API-Key: ${PORTAINER_KEY}" \
                -H "CF-Access-Client-Id: ${CF_CLIENT_ID}" \
                -H "CF-Access-Client-Secret: ${CF_CLIENT_SECRET}" \
                -H "User-Agent: Mozilla/5.0")

              STACK_FILE=$(cat docker-compose.cv.yml)
              ENV_JSON=$(echo "$STACK_RES" | jq '.Env // []')

              PAYLOAD=$(jq -n \
                --arg file "$STACK_FILE" \
                --argjson env "$ENV_JSON" \
                '{stackFileContent: $file, env: $env, prune: true, pullImage: true}')

              curl -sS -f -o /dev/null -X PUT "${PORTAINER_URL}/api/stacks/17?endpointId=4" \
                -H "X-API-Key: ${PORTAINER_KEY}" \
                -H "CF-Access-Client-Id: ${CF_CLIENT_ID}" \
                -H "CF-Access-Client-Secret: ${CF_CLIENT_SECRET}" \
                -H "Content-Type: application/json" \
                -H "User-Agent: Mozilla/5.0" \
                -d "$PAYLOAD"

              echo "Stack 17 (CV Engine on inference worker) redeployed successfully."
            else
              echo "[WARN] inference worker (endpoint 4) is currently unreachable/offline (Status: ${DEVBOX_STATUS})."
              echo "Skipping Stack 17 redeployment. edge host continues running normally with Gemini fallback."
            fi
          fi

      - name: Verify Post-Deploy Health
        run: |
          echo "Verifying health after redeployment..."
          sleep 10
          curl -sS -f -m 15 https://warded-stg.529studio.site/health || {
            echo "Staging backend health check failed!"
            exit 1
          }
          echo "Staging backend health check passed."

          if [ -n "${{ secrets.PORTAINER_API_KEY }}" ] && ([ "${{ needs.detect-changes.outputs.model }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]); then
            DEVBOX_STATUS=$(curl -sS -m 8 "https://REDACTED_ADMIN_HOST/api/endpoints/4" \
              -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}" \
              -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
              -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
              -H "User-Agent: Mozilla/5.0" | jq -r '.Status // 2' 2>/dev/null || echo "2")

            if [ "$DEVBOX_STATUS" = "1" ]; then
              CONTAINER_HEALTH=$(curl -sS -m 15 "https://REDACTED_ADMIN_HOST/api/endpoints/4/docker/containers/json" \
                -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}" \
                -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
                -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
                -H "User-Agent: Mozilla/5.0" | jq -r '.[] | select(.Names[] == "/warded-cv-engine") | .State')
              echo "inference worker CV container state: ${CONTAINER_HEALTH}"
              if [ "${CONTAINER_HEALTH}" != "running" ]; then
                echo "[WARN] CV engine container is not in running state on inference worker (${CONTAINER_HEALTH})."
              else
                echo "inference worker CV engine verification passed."
              fi
            else
              echo "[INFO] inference worker is offline. Skipping inference worker container verification."
            fi
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3: Notify Alert Gateway (Failure & Deploy Success)
  # ────────────────────────────────────────────────────────────────────────────
  notify-status:
    name: Notify Alert Gateway
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-model, deploy]
    if: always()

    steps:
      - name: Send Alert to Gateway
        env:
          ALERT_URL: ${{ secrets.ALERT_GATEWAY_URL || 'https://REDACTED_WEBHOOK_HOST/webhook/alert-gateway' }}
          ALERT_KEY: ${{ secrets.ALERT_GATEWAY_KEY || 'REDACTED_ALERT_GATEWAY_KEY' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.sha }}
          BE_RES: ${{ needs.build-backend.result }}
          FE_RES: ${{ needs.build-frontend.result }}
          MODEL_RES: ${{ needs.build-model.result }}
          DP_RES: ${{ needs.deploy.result }}
        run: |
          if [ "$BE_RES" = "failure" ] || [ "$FE_RES" = "failure" ] || [ "$MODEL_RES" = "failure" ] || [ "$DP_RES" = "failure" ]; then
            SEVERITY="CRITICAL"
            TITLE="CI/CD Failed: ${{ github.repository }}"
            MESSAGE="Pipeline thất bại tại commit: $COMMIT_MSG (Branch: ${{ github.ref_name }} by @${{ github.actor }})"
          elif [ "$DP_RES" = "success" ]; then
            SEVERITY="SUCCESS"
            TITLE="Deploy Success: ${{ github.repository }}"
            MESSAGE="Đã build và triển khai thành công Camera View lên Warded STG (Portainer Stacks 14 & 17) - Commit: $COMMIT_MSG"
          else
            exit 0
          fi

          PAYLOAD=$(cat <<JSON
          {
            "target": "devteam",
            "source": "camera-view-ci-cd",
            "severity": "$SEVERITY",
            "title": "$TITLE",
            "message": "$MESSAGE",
            "url": "$RUN_URL"
          }
          JSON
          )

          curl -s -m 10 -o /dev/null -X POST "$ALERT_URL" \
            -H "X-Alert-Key: $ALERT_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
