name: Docker Build, Publish and Deploy

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - '.githooks/**'
      - '.github/workflows/ci.yml'
      - '.env.example'
      - '.env.stg.example'
  workflow_dispatch:
    inputs:
      custom_tag:
        description: "Optional custom image tag"
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  pull-requests: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 0: Detect Changed Components
  # ────────────────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      model: ${{ steps.filter.outputs.model }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'services/go-server/**'
              - 'cameras_all.json'
              - 'cameras_enriched.json'
              - 'h3_hex_polygons.json'
              - 'docker-compose.stg.yml'
              - '.github/workflows/docker-publish.yml'
            frontend:
              - 'apps/web/**'
              - 'docker-compose.stg.yml'
              - '.github/workflows/docker-publish.yml'
            model:
              - 'services/cv-engine/**'
              - 'docker-compose.cv.yml'
              - '.github/workflows/docker-publish.yml'

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1A: Build & Push Go Backend Service
  # ────────────────────────────────────────────────────────────────────────────
  build-backend:
    name: Build & Push Backend Image
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Image Tags
        id: meta
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend" | tr '[:upper:]' '[:lower:]')
          LEGACY_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          TAGS="${IMAGE_LOWER}:${{ github.sha }},${LEGACY_LOWER}:${{ github.sha }}"

          if [ "${{ github.ref_name }}" = "dev" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:dev,${IMAGE_LOWER}:stg-latest,${IMAGE_LOWER}:latest,${LEGACY_LOWER}:dev,${LEGACY_LOWER}:stg-latest,${LEGACY_LOWER}:latest"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:latest,${LEGACY_LOWER}:latest"
          fi

          if [ -n "${{ inputs.custom_tag }}" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:${{ inputs.custom_tag }},${LEGACY_LOWER}:${{ inputs.custom_tag }}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/go-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1B: Build & Push Web Frontend Service (Nginx)
  # ────────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build & Push Frontend Image
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Image Tags
        id: meta
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend" | tr '[:upper:]' '[:lower:]')
          TAGS="${IMAGE_LOWER}:${{ github.sha }}"

          if [ "${{ github.ref_name }}" = "dev" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:dev,${IMAGE_LOWER}:stg-latest,${IMAGE_LOWER}:latest"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:latest"
          fi

          if [ -n "${{ inputs.custom_tag }}" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:${{ inputs.custom_tag }}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1C: Build & Push Model Service (OpenVINO CV Engine)
  # ────────────────────────────────────────────────────────────────────────────
  build-model:
    name: Build & Push Model Image
    needs: detect-changes
    if: needs.detect-changes.outputs.model == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Image Tags
        id: meta
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-model" | tr '[:upper:]' '[:lower:]')
          TAGS="${IMAGE_LOWER}:${{ github.sha }}"

          if [ "${{ github.ref_name }}" = "dev" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:dev,${IMAGE_LOWER}:stg-latest,${IMAGE_LOWER}:latest"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:latest"
          fi

          if [ -n "${{ inputs.custom_tag }}" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:${{ inputs.custom_tag }}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Model Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/cv-engine/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=model
          cache-to: type=gha,mode=max,scope=model

  # Deployment is not a workflow job.
  #
  # The scheduler container on the staging host polls this branch, waits for the build run of the
  # newest commit to finish successfully, and applies the stack file and the
  # per-service image tags through the local Portainer API. That keeps the
  # Portainer credential on the host, keeps Portainer off the public Internet and
  # removes the Cloudflare service token from this repository.
