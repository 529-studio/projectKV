name: Docker Build, Publish and Deploy

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - '.githooks/**'
      - '.github/workflows/auto-request-reviewers.yml'
      - '.github/workflows/branch-guard.yml'
      - '.github/workflows/ci.yml'
      - '.env.example'
      - '.env.stg.example'
  workflow_dispatch:
    inputs:
      custom_tag:
        description: "Optional custom image tag"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 0: Detect Changed Components
  # ────────────────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      model: ${{ steps.filter.outputs.model }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'services/go-server/**'
              - 'cameras_all.json'
              - 'cameras_enriched.json'
              - 'h3_hex_polygons.json'
              - 'docker-compose.stg.yml'
              - '.github/workflows/docker-publish.yml'
            frontend:
              - 'apps/web/**'
              - 'docker-compose.stg.yml'
              - '.github/workflows/docker-publish.yml'
            model:
              - 'services/cv-engine/**'
              - 'docker-compose.cv.yml'
              - '.github/workflows/docker-publish.yml'

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1A: Build & Push Go Backend Service
  # ────────────────────────────────────────────────────────────────────────────
  build-backend:
    name: Build & Push Backend Image
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Image Tags
        id: meta
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend" | tr '[:upper:]' '[:lower:]')
          LEGACY_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          TAGS="${IMAGE_LOWER}:${{ github.sha }},${LEGACY_LOWER}:${{ github.sha }}"

          if [ "${{ github.ref_name }}" = "dev" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:dev,${IMAGE_LOWER}:stg-latest,${IMAGE_LOWER}:latest,${LEGACY_LOWER}:dev,${LEGACY_LOWER}:stg-latest,${LEGACY_LOWER}:latest"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:latest,${LEGACY_LOWER}:latest"
          fi

          if [ -n "${{ inputs.custom_tag }}" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:${{ inputs.custom_tag }},${LEGACY_LOWER}:${{ inputs.custom_tag }}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/go-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1B: Build & Push Web Frontend Service (Nginx)
  # ────────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build & Push Frontend Image
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Image Tags
        id: meta
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend" | tr '[:upper:]' '[:lower:]')
          TAGS="${IMAGE_LOWER}:${{ github.sha }}"

          if [ "${{ github.ref_name }}" = "dev" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:dev,${IMAGE_LOWER}:stg-latest,${IMAGE_LOWER}:latest"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:latest"
          fi

          if [ -n "${{ inputs.custom_tag }}" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:${{ inputs.custom_tag }}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1C: Build & Push Model Service (OpenVINO CV Engine)
  # ────────────────────────────────────────────────────────────────────────────
  build-model:
    name: Build & Push Model Image
    needs: detect-changes
    if: needs.detect-changes.outputs.model == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Image Tags
        id: meta
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-model" | tr '[:upper:]' '[:lower:]')
          TAGS="${IMAGE_LOWER}:${{ github.sha }}"

          if [ "${{ github.ref_name }}" = "dev" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:dev,${IMAGE_LOWER}:stg-latest,${IMAGE_LOWER}:latest"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:latest"
          fi

          if [ -n "${{ inputs.custom_tag }}" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:${{ inputs.custom_tag }}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Model Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/cv-engine/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=model
          cache-to: type=gha,mode=max,scope=model

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Deploy to Staging
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    needs: [detect-changes, build-backend, build-frontend, build-model]
    if: |
      always() &&
      (github.event_name == 'push' && github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch') &&
      needs.build-backend.result != 'failure' && needs.build-backend.result != 'cancelled' &&
      needs.build-frontend.result != 'failure' && needs.build-frontend.result != 'cancelled' &&
      needs.build-model.result != 'failure' && needs.build-model.result != 'cancelled' &&
      (needs.build-backend.result == 'success' || needs.build-frontend.result == 'success' || needs.build-model.result == 'success')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Staging Redeploy
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_KEY: ${{ secrets.PORTAINER_API_KEY }}
          CF_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          STACK_APP_ID: ${{ secrets.PORTAINER_STACK_APP }}
          STACK_CV_ID: ${{ secrets.PORTAINER_STACK_CV }}
          EP_EDGE_ID: ${{ secrets.PORTAINER_ENDPOINT_HOMESRV }}
          EP_WORKER_ID: ${{ secrets.PORTAINER_ENDPOINT_DEVBOX }}
          CV_ENGINE_URL: ${{ secrets.CV_ENGINE_URL }}
        run: |
          if [ -z "${PORTAINER_KEY}" ] || [ -z "${PORTAINER_URL}" ]; then
            echo "PORTAINER_URL / PORTAINER_API_KEY not configured — skipping deploy trigger."
            exit 0
          fi

          # Step A: Redeploy the application stack on the edge host
          if [ "${{ needs.detect-changes.outputs.backend }}" = "true" ] || [ "${{ needs.detect-changes.outputs.frontend }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Triggering staging application stack redeploy..."
            STACK_RES=$(curl -sS -f -X GET "${PORTAINER_URL}/api/stacks/${STACK_APP_ID}" \
              -H "X-API-Key: ${PORTAINER_KEY}" \
              -H "CF-Access-Client-Id: ${CF_CLIENT_ID}" \
              -H "CF-Access-Client-Secret: ${CF_CLIENT_SECRET}" \
              -H "User-Agent: Mozilla/5.0")

            STACK_FILE=$(cat docker-compose.stg.yml)
            if [ -z "${CV_ENGINE_URL}" ]; then
              echo "CV_ENGINE_URL is not configured — refusing to redeploy the application stack."
              exit 1
            fi
            ENV_JSON=$(echo "$STACK_RES" | jq --arg url "${CV_ENGINE_URL}" '
              (.Env // []) | map(select(.name != "CV_ENGINE_URL")) + [{"name": "CV_ENGINE_URL", "value": $url}]
            ')

            PAYLOAD=$(jq -n \
              --arg file "$STACK_FILE" \
              --argjson env "$ENV_JSON" \
              '{stackFileContent: $file, env: $env, prune: true, pullImage: true}')

            curl -sS -f -o /dev/null -X PUT "${PORTAINER_URL}/api/stacks/${STACK_APP_ID}?endpointId=${EP_EDGE_ID}" \
              -H "X-API-Key: ${PORTAINER_KEY}" \
              -H "CF-Access-Client-Id: ${CF_CLIENT_ID}" \
              -H "CF-Access-Client-Secret: ${CF_CLIENT_SECRET}" \
              -H "Content-Type: application/json" \
              -H "User-Agent: Mozilla/5.0" \
              -d "$PAYLOAD"

            echo "Application stack redeployed successfully."
          fi

          # Step B: Redeploy the model inference stack on the worker host
          if [ "${{ needs.detect-changes.outputs.model }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Checking worker host availability..."
            DEVBOX_STATUS=$(curl -sS -m 8 "${PORTAINER_URL}/api/endpoints/${EP_WORKER_ID}" \
              -H "X-API-Key: ${PORTAINER_KEY}" \
              -H "CF-Access-Client-Id: ${CF_CLIENT_ID}" \
              -H "CF-Access-Client-Secret: ${CF_CLIENT_SECRET}" \
              -H "User-Agent: Mozilla/5.0" | jq -r '.Status // 2' 2>/dev/null || echo "2")

            if [ "$DEVBOX_STATUS" = "1" ]; then
              echo "Worker host is online. Triggering model inference stack redeploy..."
              STACK_RES=$(curl -sS -f -X GET "${PORTAINER_URL}/api/stacks/${STACK_CV_ID}" \
                -H "X-API-Key: ${PORTAINER_KEY}" \
                -H "CF-Access-Client-Id: ${CF_CLIENT_ID}" \
                -H "CF-Access-Client-Secret: ${CF_CLIENT_SECRET}" \
                -H "User-Agent: Mozilla/5.0")

              STACK_FILE=$(cat docker-compose.cv.yml)
              ENV_JSON=$(echo "$STACK_RES" | jq '.Env // []')

              PAYLOAD=$(jq -n \
                --arg file "$STACK_FILE" \
                --argjson env "$ENV_JSON" \
                '{stackFileContent: $file, env: $env, prune: true, pullImage: true}')

              curl -sS -f -o /dev/null -X PUT "${PORTAINER_URL}/api/stacks/${STACK_CV_ID}?endpointId=${EP_WORKER_ID}" \
                -H "X-API-Key: ${PORTAINER_KEY}" \
                -H "CF-Access-Client-Id: ${CF_CLIENT_ID}" \
                -H "CF-Access-Client-Secret: ${CF_CLIENT_SECRET}" \
                -H "Content-Type: application/json" \
                -H "User-Agent: Mozilla/5.0" \
                -d "$PAYLOAD"

              echo "Model inference stack redeployed successfully."
            else
              echo "[WARN] Worker host is currently unreachable/offline (Status: ${DEVBOX_STATUS})."
              echo "Skipping model stack redeployment. The edge host continues serving with the fallback path."
            fi
          fi

      - name: Verify Post-Deploy Health
        env:
          STG_HEALTH_URL: ${{ secrets.STG_HEALTH_URL }}
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_KEY: ${{ secrets.PORTAINER_API_KEY }}
          CF_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EP_WORKER_ID: ${{ secrets.PORTAINER_ENDPOINT_DEVBOX }}
          CV_CONTAINER_NAME: ${{ secrets.PORTAINER_CV_CONTAINER_NAME }}
        run: |
          echo "Verifying health after redeployment..."
          sleep 10
          if [ -z "${STG_HEALTH_URL}" ]; then
            echo "[WARN] STG_HEALTH_URL is not configured — skipping the staging health probe."
          else
            curl -sS -f -m 15 "${STG_HEALTH_URL}" || {
              echo "Staging backend health check failed!"
              exit 1
            }
            echo "Staging backend health check passed."
          fi

          if [ -n "${PORTAINER_KEY}" ] && ([ "${{ needs.detect-changes.outputs.model }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]); then
            DEVBOX_STATUS=$(curl -sS -m 8 "${PORTAINER_URL}/api/endpoints/${EP_WORKER_ID}" \
              -H "X-API-Key: ${PORTAINER_KEY}" \
              -H "CF-Access-Client-Id: ${CF_CLIENT_ID}" \
              -H "CF-Access-Client-Secret: ${CF_CLIENT_SECRET}" \
              -H "User-Agent: Mozilla/5.0" | jq -r '.Status // 2' 2>/dev/null || echo "2")

            if [ "$DEVBOX_STATUS" = "1" ]; then
              CONTAINER_HEALTH=$(curl -sS -m 15 "${PORTAINER_URL}/api/endpoints/${EP_WORKER_ID}/docker/containers/json" \
                -H "X-API-Key: ${PORTAINER_KEY}" \
                -H "CF-Access-Client-Id: ${CF_CLIENT_ID}" \
                -H "CF-Access-Client-Secret: ${CF_CLIENT_SECRET}" \
                -H "User-Agent: Mozilla/5.0" | jq -r --arg name "/${CV_CONTAINER_NAME}" '.[] | select(.Names[] == $name) | .State')
              echo "Model inference container state: ${CONTAINER_HEALTH}"
              if [ "${CONTAINER_HEALTH}" != "running" ]; then
                echo "[WARN] Model inference container is not in running state on the worker host (${CONTAINER_HEALTH})."
              else
                echo "Model inference container verification passed."
              fi
            else
              echo "[INFO] Worker host is offline. Skipping container verification."
            fi
          fi
