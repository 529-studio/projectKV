name: Docker Build, Publish and Deploy

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      custom_tag:
        description: "Optional custom image tag"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Image Tags
        id: meta
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          TAGS="${IMAGE_LOWER}:${{ github.sha }}"

          if [ "${{ github.ref_name }}" = "dev" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:dev,${IMAGE_LOWER}:stg-latest,${IMAGE_LOWER}:latest"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:latest"
          fi

          if [ -n "${{ inputs.custom_tag }}" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:${{ inputs.custom_tag }}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy via Portainer
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - name: Trigger Portainer Redeploy
        run: |
          if [ -z "${{ secrets.PORTAINER_API_KEY }}" ]; then
            echo "PORTAINER_API_KEY is not set — skipping deploy trigger."
            exit 0
          fi
          echo "Triggering Portainer stack redeploy..."
          STACK_ID="14"
          STACK_RES=$(curl -sS -f -X GET "https://REDACTED_ADMIN_HOST/api/stacks/${STACK_ID}" \
            -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}" \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            -H "User-Agent: Mozilla/5.0")

          STACK_FILE=$(cat docker-compose.stg.yml)

          ENV_JSON=$(echo "$STACK_RES" | jq .Env)

          PAYLOAD=$(jq -n \
            --arg file "$STACK_FILE" \
            --argjson env "$ENV_JSON" \
            '{stackFileContent: $file, env: $env, prune: true, pullImage: true}')

          curl -sS -f -o /dev/null -X PUT "https://REDACTED_ADMIN_HOST/api/stacks/${STACK_ID}?endpointId=3" \
            -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}" \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0" \
            -d "$PAYLOAD"

          echo "Portainer deploy completed successfully."

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3: Notify Alert Gateway (Failure & Deploy Success)
  # ────────────────────────────────────────────────────────────────────────────
  notify-status:
    name: Notify Alert Gateway
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    if: always()

    steps:
      - name: Send Alert to Gateway
        env:
          ALERT_URL: ${{ secrets.ALERT_GATEWAY_URL || 'https://REDACTED_WEBHOOK_HOST/webhook/alert-gateway' }}
          ALERT_KEY: ${{ secrets.ALERT_GATEWAY_KEY || 'REDACTED_ALERT_GATEWAY_KEY' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.sha }}
          BP_RES: ${{ needs.build-and-push.result }}
          DP_RES: ${{ needs.deploy.result }}
        run: |
          if [ "$BP_RES" = "failure" ] || [ "$DP_RES" = "failure" ]; then
            SEVERITY="CRITICAL"
            TITLE="CI/CD Failed: ${{ github.repository }}"
            MESSAGE="Pipeline thất bại tại commit: $COMMIT_MSG (Branch: ${{ github.ref_name }} by @${{ github.actor }})"
          elif [ "$DP_RES" = "success" ]; then
            SEVERITY="SUCCESS"
            TITLE="Deploy Success: ${{ github.repository }}"
            MESSAGE="Đã build và triển khai thành công Camera View lên Warded STG (Portainer Stack 14) - Commit: $COMMIT_MSG"
          else
            exit 0
          fi

          PAYLOAD=$(cat <<JSON
          {
            "target": "devteam",
            "source": "camera-view-ci-cd",
            "severity": "$SEVERITY",
            "title": "$TITLE",
            "message": "$MESSAGE",
            "url": "$RUN_URL"
          }
          JSON
          )

          curl -s -m 10 -o /dev/null -X POST "$ALERT_URL" \
            -H "X-Alert-Key: $ALERT_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
