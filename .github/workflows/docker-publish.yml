name: Docker Build, Publish and Deploy

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      custom_tag:
        description: "Optional custom image tag"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Image Tags
        id: meta
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          TAGS="${IMAGE_LOWER}:${{ github.sha }}"

          if [ "${{ github.ref_name }}" = "dev" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:dev,${IMAGE_LOWER}:stg-latest,${IMAGE_LOWER}:latest"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:latest"
          fi

          if [ -n "${{ inputs.custom_tag }}" ]; then
            TAGS="${TAGS},${IMAGE_LOWER}:${{ inputs.custom_tag }}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy via Portainer
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - name: Trigger Portainer Redeploy
        run: |
          if [ -z "${{ secrets.PORTAINER_API_KEY }}" ]; then
            echo "PORTAINER_API_KEY is not set — skipping deploy trigger."
            exit 0
          fi
          echo "Triggering Portainer stack redeploy..."
          STACK_ID="14"
          STACK_RES=$(curl -sS -f -X GET "https://REDACTED_ADMIN_HOST/api/stacks/${STACK_ID}" \
            -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}" \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            -H "User-Agent: Mozilla/5.0")

          STACK_FILE=$(curl -sS -f -X GET "https://REDACTED_ADMIN_HOST/api/stacks/${STACK_ID}/file" \
            -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}" \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            -H "User-Agent: Mozilla/5.0" | jq -r .StackFileContent)

          ENV_JSON=$(echo "$STACK_RES" | jq .Env)

          PAYLOAD=$(jq -n \
            --arg file "$STACK_FILE" \
            --argjson env "$ENV_JSON" \
            '{stackFileContent: $file, env: $env, prune: true, pullImage: true}')

          curl -sS -f -o /dev/null -X PUT "https://REDACTED_ADMIN_HOST/api/stacks/${STACK_ID}?endpointId=3" \
            -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}" \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0" \
            -d "$PAYLOAD"

          echo "Portainer deploy completed successfully."
