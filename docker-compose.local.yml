# Local development Docker Compose configuration for OpenVINO inference service
# Usage:
#   docker compose -f docker-compose.local.yml up -d
#   docker compose -f docker-compose.local.yml logs -f
#   docker compose -f docker-compose.local.yml down

services:
  warded-model:
    build:
      context: .
      dockerfile: services/cv-engine/Dockerfile
    image: projectkv-cv-engine:local
    container_name: warded-model
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MODEL_DIR=/app/models/yolov8n_openvino_320
      - CV_INPUT_RESOLUTION=${CV_INPUT_RESOLUTION:-}
    volumes:
      - ./yolov8n_openvino_model:/app/models/yolov8n_openvino_320:ro
      - ./services/cv-engine/server.py:/app/server.py:ro
      # `server.py` imports this sibling module at load time; without the mount the
      # container starts from the image copy and silently ignores local edits.
      - ./services/cv-engine/hazard_classifier.py:/app/hazard_classifier.py:ro
      # Operator calibration (§2.2). The repository ships an empty template
      # (`{"version": 1, "cameras": {}}`), so the bind mount always resolves to a file:
      # a missing path here would be auto-created as a directory and fail the loader.
      - ./services/cv-engine/calibration.json:/app/calibration.json:ro
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: "512M"
