services:
  # One-shot volume ownership repair (Issue #442 / S14-T2). A freshly created
  # Docker volume is owned by root, while the forecast cron and Litestream
  # sidecar run as 10001:10001. Without this the forecast refit fails to write
  # its state and Litestream cannot read the WAL. The backend also gates on it so
  # the volume is in a known state before any service touches it. It runs as root
  # only long enough to mkdir/chown/chmod, then exits.
  warded-init-vol:
    image: alpine:3.20
    container_name: ${INIT_VOL_CONTAINER_NAME:-warded-init-vol}
    restart: "no"
    user: "0:0"
    networks:
      - core-network
    volumes:
      - warded-stg-data:/app/data
    command:
      - sh
      - -c
      - mkdir -p /app/data/locks /app/data/forecast /app/data/proofs && chown -R 10001:10001 /app/data && chmod -R 775 /app/data
    security_opt:
      - no-new-privileges:true

  warded-backend:
    image: ${BE_IMAGE_NAME:-ghcr.io/529-studio/projectkv-backend}:${BE_IMAGE_TAG:-${IMAGE_TAG:-stg-latest}}
    container_name: ${BE_CONTAINER_NAME:-warded-backend}
    restart: unless-stopped
    pull_policy: always
    networks:
      - core-network
    depends_on:
      warded-init-vol:
        condition: service_completed_successfully
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - PORT=${BE_PORT:-3000}
      - GIN_MODE=${GIN_MODE:-release}
      - APP_ENV=${APP_ENV:-staging}
      - CAMERAS_FILE_PATH=${CAMERAS_FILE_PATH:-/app/cameras_enriched.json}
      - HEX_POLYGON_FILE_PATH=${HEX_POLYGON_FILE_PATH:-/app/h3_hex_polygons.json}
      - SQLITE_PATH=${SQLITE_PATH:-/app/data/camera-view.db}
      - SNAPSHOT_UPSTREAM_BASE_URL=${SNAPSHOT_UPSTREAM_BASE_URL:-https://giaothong.hochiminhcity.gov.vn/render/ImageHandler.ashx}
      - SNAPSHOT_CACHE_TTL_SECONDS=${SNAPSHOT_CACHE_TTL_SECONDS:-10}
      - HOTSET_INTERVAL_SECONDS=${HOTSET_INTERVAL_SECONDS:-30}
      - HOTSET_ACTIVE_TTL_SECONDS=${HOTSET_ACTIVE_TTL_SECONDS:-120}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - ANALYZER=${ANALYZER:-onnx}
      - ANALYZER_DAILY_BUDGET=${ANALYZER_DAILY_BUDGET:-500000}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CLOUD_VISION_API_KEY=${CLOUD_VISION_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - CV_ENGINE_URL=${CV_ENGINE_URL:?CV_ENGINE_URL must be provided by the deployment pipeline}
      - DEV_ACCESS_TOKEN=${DEV_ACCESS_TOKEN:-}
      - CF_ACCESS_AUDIENCE=${CF_ACCESS_AUDIENCE:-}
      - CF_ACCESS_CERTS_URL=${CF_ACCESS_CERTS_URL:-}
      - CF_ACCESS_CLIENT_ID=${CF_ACCESS_CLIENT_ID:-}
      - CF_ACCESS_CLIENT_SECRET=${CF_ACCESS_CLIENT_SECRET:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-r2}
      - STORAGE_LOCAL_ROOT=${STORAGE_LOCAL_ROOT:-/app/data/proofs}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-warded-proofs}
      - R2_REGION=${R2_REGION:-auto}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-https://file.529studio.site}
      - ARCHIVE_SAMPLE_INTERVAL_SECONDS=${ARCHIVE_SAMPLE_INTERVAL_SECONDS:-300}
      - ARCHIVE_RETENTION_DAYS=${ARCHIVE_RETENTION_DAYS:-7}
      - HARVESTER_ENABLED=${HARVESTER_ENABLED:-true}
      - HARVESTER_SCHEDULE_HOURS=${HARVESTER_SCHEDULE_HOURS:-07:30,12:00,17:30}
      - HARVESTER_CONCURRENCY=${HARVESTER_CONCURRENCY:-15}
      - HARVESTER_RAIN_COOLDOWN_MINUTES=${HARVESTER_RAIN_COOLDOWN_MINUTES:-60}
      - HARVESTER_CATCHUP_MINUTES=${HARVESTER_CATCHUP_MINUTES:-120}
      # Telegram alert bot (Issue #402 / S12-T4). Empty values leave the inbound
      # webhook unmounted (404) and keep dispatch in simulation mode.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - TELEGRAM_DEBOUNCE_MINUTES=${TELEGRAM_DEBOUNCE_MINUTES:-30}
      - FORECAST_MODEL_PATH=${FORECAST_MODEL_PATH:-/app/data/forecast/prototype_v1.json}
      - FORECAST_MODEL_RELOAD_INTERVAL_SEC=${FORECAST_MODEL_RELOAD_INTERVAL_SEC:-60}
    volumes:
      - warded-stg-data:/app/data
    deploy:
      resources:
        limits:
          cpus: "${BE_CPU_LIMIT:-0.50}"
          memory: "${BE_MEMORY_LIMIT:-256M}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${DOCKER_NETWORK:-core-network}"
      - "traefik.http.routers.${ROUTER_NAME:-warded-stg}-be.rule=Host(`${DOMAIN_NAME:-warded-stg.529studio.site}`) && (PathPrefix(`/api`) || PathPrefix(`/ws`) || PathPrefix(`/health`) || PathPrefix(`/swagger`))"
      - "traefik.http.routers.${ROUTER_NAME:-warded-stg}-be.entrypoints=${TRAEFIK_ENTRYPOINT:-web}"
      - "traefik.http.routers.${ROUTER_NAME:-warded-stg}-be.priority=100"
      - "traefik.http.services.${ROUTER_NAME:-warded-stg}-be.loadbalancer.server.port=${BE_PORT:-3000}"

  warded-frontend:
    image: ${FE_IMAGE_NAME:-ghcr.io/529-studio/projectkv-frontend}:${FE_IMAGE_TAG:-${IMAGE_TAG:-stg-latest}}
    container_name: ${FE_CONTAINER_NAME:-warded-frontend}
    restart: unless-stopped
    pull_policy: always
    networks:
      - core-network
    deploy:
      resources:
        limits:
          cpus: "${FE_CPU_LIMIT:-0.25}"
          memory: "${FE_MEMORY_LIMIT:-64M}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${DOCKER_NETWORK:-core-network}"
      - "traefik.http.routers.${ROUTER_NAME:-warded-stg}-fe.rule=Host(`${DOMAIN_NAME:-warded-stg.529studio.site}`)"
      - "traefik.http.routers.${ROUTER_NAME:-warded-stg}-fe.entrypoints=${TRAEFIK_ENTRYPOINT:-web}"
      - "traefik.http.routers.${ROUTER_NAME:-warded-stg}-fe.priority=1"
      - "traefik.http.services.${ROUTER_NAME:-warded-stg}-fe.loadbalancer.server.port=80"

  warded-model:
    profiles: ["model-local"]
    image: ${MODEL_IMAGE_NAME:-ghcr.io/529-studio/projectkv-model}:${MODEL_IMAGE_TAG:-${IMAGE_TAG:-stg-latest}}
    container_name: ${MODEL_CONTAINER_NAME:-warded-model}
    restart: unless-stopped
    pull_policy: always
    networks:
      - core-network
    environment:
      - PORT=${MODEL_PORT:-8000}
      - MODEL_DIR=${MODEL_DIR:-/app/models/yolov8n_openvino_320}
      - CV_INPUT_RESOLUTION=${CV_INPUT_RESOLUTION:-}
    deploy:
      resources:
        limits:
          cpus: "${MODEL_CPU_LIMIT:-1.00}"
          memory: "${MODEL_MEMORY_LIMIT:-512M}"
    labels:
      - "traefik.enable=false"
    volumes:
      - warded-model-weights:/app/models

  warded-harvester:
    profiles: ["harvester"]
    image: python:3.11-slim
    container_name: ${HARVESTER_CONTAINER_NAME:-warded-harvester}
    restart: unless-stopped
    networks:
      - core-network
    volumes:
      - warded-stg-data:/app/data
      - ./:/workspace:ro
    working_dir: /workspace
    command: ["python3", "tools/harvester/service.py", "--daemon", "--interval", "300", "--db-path", "/app/data/camera-view.db", "--proof-dir", "/app/data/proofs", "--state-path", "/app/data/harvester_soak_state.json", "--telemetry-out", "/app/data/harvester_soak_status.json"]
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - BACKEND_URL=${BACKEND_URL:-http://warded-backend:3000}
      - CV_ENGINE_URL=${CV_ENGINE_URL:-http://warded-model:8000}
      - DEV_ACCESS_TOKEN=${DEV_ACCESS_TOKEN:-}

  warded-forecast-cron:
    profiles: ["forecast-refit", "forecast-cron"]
    image: python:3.11-slim
    container_name: ${FORECAST_CRON_CONTAINER_NAME:-warded-forecast-cron}
    restart: unless-stopped
    user: "10001:10001"
    networks:
      - core-network
    depends_on:
      warded-init-vol:
        condition: service_completed_successfully
    read_only: true
    init: true
    stop_grace_period: 60s
    volumes:
      - warded-stg-data:/app/data
      - ./:/workspace:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    working_dir: /workspace
    healthcheck:
      test: ["CMD", "python3", "tools/forecast/train_live_model.py", "--health", "--state-file", "/app/data/forecast/refit_state.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command:
      - python3
      - -u
      - tools/forecast/train_live_model.py
      - --daemon
      - --interval
      - "${FORECAST_REFIT_INTERVAL:-21600}"
      - --db
      - /app/data/camera-view.db
      - --features-out
      - /app/data/forecast/features_live_5m.csv
      - --artifact-out
      - /app/data/forecast/prototype_v1.json
      - --report-out
      - /app/data/forecast/forecast_prototype_v1.md
      - --eval-json-out
      - /app/data/forecast/forecast_prototype_v1.json
      - --lock-file
      - /app/data/locks/refit.lock
      - --state-file
      - /app/data/forecast/refit_state.json
      - --telemetry-out
      - /app/data/forecast/refit_status.json
      - --min-new-rows
      - "${FORECAST_MIN_NEW_ROWS:-50}"
      - --promote
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - HOME=/tmp
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Continuous SQLite replication to Cloudflare R2 (Issue #442 / S14-T2).
  # Litestream tails camera-view.db's WAL and ships committed frames to
  # s3://${R2_BUCKET_NAME}/db-replicas/camera-view.db every second. The config is
  # mounted read-only; credentials arrive only as environment variables.
  warded-litestream:
    image: litestream/litestream:0.3.13
    container_name: ${LITESTREAM_CONTAINER_NAME:-warded-litestream}
    restart: unless-stopped
    user: "10001:10001"
    networks:
      - core-network
    depends_on:
      warded-init-vol:
        condition: service_completed_successfully
    volumes:
      - warded-stg-data:/app/data
      - ./deploy/litestream/litestream.yml:/etc/litestream.yml:ro
    command: ["replicate", "-config", "/etc/litestream.yml"]
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - HOME=/tmp
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-warded-proofs}
      # Required, never defaulted to empty: a missing endpoint would make the
      # S3 client talk to AWS and hand it R2 credentials.
      - R2_ENDPOINT=${R2_ENDPOINT:?R2_ENDPOINT must be provided for Litestream replication}
      - R2_REGION=${R2_REGION:-auto}
      # LITESTREAM_* wins; the R2 credentials are the documented fallback.
      - LITESTREAM_ACCESS_KEY_ID=${LITESTREAM_ACCESS_KEY_ID:-${R2_ACCESS_KEY_ID:-}}
      - LITESTREAM_SECRET_ACCESS_KEY=${LITESTREAM_SECRET_ACCESS_KEY:-${R2_SECRET_ACCESS_KEY:-}}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "${LITESTREAM_CPU_LIMIT:-0.20}"
          memory: "${LITESTREAM_MEMORY_LIMIT:-64M}"

volumes:
  warded-stg-data:
    name: ${DATA_VOLUME_NAME:-warded-stg_warded-stg-data}
  warded-model-weights:
    name: ${MODEL_VOLUME_NAME:-warded-stg_warded-model-weights}

networks:
  core-network:
    name: ${DOCKER_NETWORK:-core-network}
    external: true
