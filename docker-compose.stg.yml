services:
  # One-shot volume ownership repair (Issue #442 / S14-T2). A freshly created
  # Docker volume is owned by root, while the forecast cron and backup sidecar
  # run as 10001:10001. Without this the forecast refit fails to write its state
  # or its lock, and the backup sidecar cannot open the database. The backend
  # also gates on it so the volume is in a known state before any service
  # touches it. It runs as root only long enough to mkdir/chown/chmod, then
  # exits.
  warded-init-vol:
    image: alpine:3.20
    container_name: ${INIT_VOL_CONTAINER_NAME:-warded-init-vol}
    restart: "no"
    user: "0:0"
    networks:
      - core-network
    volumes:
      - warded-stg-data:/app/data
    command:
      - sh
      - -c
      - mkdir -p /app/data/locks /app/data/forecast /app/data/proofs && chown -R 10001:10001 /app/data && chmod -R 775 /app/data
    security_opt:
      - no-new-privileges:true

  warded-backend:
    image: ${BE_IMAGE_NAME:-ghcr.io/529-studio/projectkv-backend}:${BE_IMAGE_TAG:-${IMAGE_TAG:-stg-latest}}
    container_name: ${BE_CONTAINER_NAME:-warded-backend}
    restart: unless-stopped
    pull_policy: ${PULL_POLICY:-missing}
    networks:
      - core-network
    depends_on:
      warded-init-vol:
        condition: service_completed_successfully
    dns:
      - 1.1.1.1
      - 8.8.8.8
    security_opt:
      - no-new-privileges:true
    environment:
      - PORT=${BE_PORT:-3000}
      - GIN_MODE=${GIN_MODE:-release}
      - APP_ENV=${APP_ENV:-staging}
      - CAMERAS_FILE_PATH=${CAMERAS_FILE_PATH:-/app/cameras_enriched.json}
      - HEX_POLYGON_FILE_PATH=${HEX_POLYGON_FILE_PATH:-/app/h3_hex_polygons.json}
      - SQLITE_PATH=${SQLITE_PATH:-/app/data/camera-view.db}
      - SNAPSHOT_UPSTREAM_BASE_URL=${SNAPSHOT_UPSTREAM_BASE_URL:-https://giaothong.hochiminhcity.gov.vn/render/ImageHandler.ashx}
      - SNAPSHOT_CACHE_TTL_SECONDS=${SNAPSHOT_CACHE_TTL_SECONDS:-10}
      - HOTSET_INTERVAL_SECONDS=${HOTSET_INTERVAL_SECONDS:-30}
      - HOTSET_ACTIVE_TTL_SECONDS=${HOTSET_ACTIVE_TTL_SECONDS:-120}
      # Basemap provider for the tile proxy (Issue #443 / S14-T3). The keyless OSM
      # upstream is darkened server-side before caching; CARTO is opt-in with a key.
      - MAP_TILE_UPSTREAM_URL=${MAP_TILE_UPSTREAM_URL:-https://tile.openstreetmap.org}
      - MAP_TILE_API_KEY=${MAP_TILE_API_KEY:-}
      - MAP_TILE_DARKEN=${MAP_TILE_DARKEN:-1}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - ANALYZER=${ANALYZER:-onnx}
      - ANALYZER_DAILY_BUDGET=${ANALYZER_DAILY_BUDGET:-500000}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CLOUD_VISION_API_KEY=${CLOUD_VISION_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - CV_ENGINE_URL=${CV_ENGINE_URL:?CV_ENGINE_URL must be provided by the deployment pipeline}
      - DEV_ACCESS_TOKEN=${DEV_ACCESS_TOKEN:-}
      - CF_ACCESS_AUDIENCE=${CF_ACCESS_AUDIENCE:-58f979e92770aca2907841541616efe2c5c43572c3de9deb2f82e5f8bb101c31}
      - CF_ACCESS_CERTS_URL=${CF_ACCESS_CERTS_URL:-https://529studio.cloudflareaccess.com/cdn-cgi/access/certs}
      - CF_ACCESS_CLIENT_ID=${CF_ACCESS_CLIENT_ID:-}
      - CF_ACCESS_CLIENT_SECRET=${CF_ACCESS_CLIENT_SECRET:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-r2}
      - STORAGE_LOCAL_ROOT=${STORAGE_LOCAL_ROOT:-/app/data/proofs}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-bb67574163a065e4aad475fb3aa6bb92}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-warded-proofs}
      - R2_REGION=${R2_REGION:-auto}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - ARCHIVE_SAMPLE_INTERVAL_SECONDS=${ARCHIVE_SAMPLE_INTERVAL_SECONDS:-900}
      - ARCHIVE_RETENTION_DAYS=${ARCHIVE_RETENTION_DAYS:-7}
      - HARVESTER_ENABLED=${HARVESTER_ENABLED:-true}
      - HARVESTER_SCHEDULE_HOURS=${HARVESTER_SCHEDULE_HOURS:-07:30,12:00,17:30}
      - HARVESTER_CONCURRENCY=${HARVESTER_CONCURRENCY:-15}
      - HARVESTER_RAIN_COOLDOWN_MINUTES=${HARVESTER_RAIN_COOLDOWN_MINUTES:-60}
      - HARVESTER_CATCHUP_MINUTES=${HARVESTER_CATCHUP_MINUTES:-120}
      # Per-camera snapshot fetch budget. The upstream camera CDN is slow enough
      # that the 5s built-in default produces recurring harvest timeouts.
      - SNAPSHOT_FETCH_TIMEOUT_SECONDS=${SNAPSHOT_FETCH_TIMEOUT_SECONDS:-10}
      # Telegram alert bot (Issue #402 / S12-T4). Empty values leave the inbound
      # webhook unmounted (404) and keep dispatch in simulation mode.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - TELEGRAM_DEBOUNCE_MINUTES=${TELEGRAM_DEBOUNCE_MINUTES:-30}
      - FORECAST_MODEL_PATH=${FORECAST_MODEL_PATH:-/app/data/forecast/prototype_v1.json}
      - FORECAST_MODEL_RELOAD_INTERVAL_SEC=${FORECAST_MODEL_RELOAD_INTERVAL_SEC:-60}
    volumes:
      - warded-stg-data:/app/data
    deploy:
      resources:
        limits:
          cpus: "${BE_CPU_LIMIT:-0.50}"
          memory: "${BE_MEMORY_LIMIT:-256M}"

  warded-frontend:
    image: ${FE_IMAGE_NAME:-ghcr.io/529-studio/projectkv-frontend}:${FE_IMAGE_TAG:-${IMAGE_TAG:-stg-latest}}
    container_name: ${FE_CONTAINER_NAME:-warded-frontend}
    restart: unless-stopped
    pull_policy: ${PULL_POLICY:-missing}
    networks:
      - core-network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${FE_CPU_LIMIT:-0.25}"
          memory: "${FE_MEMORY_LIMIT:-64M}"

  warded-model:
    profiles: ["model-local"]
    image: ${MODEL_IMAGE_NAME:-ghcr.io/529-studio/projectkv-model}:${MODEL_IMAGE_TAG:-${IMAGE_TAG:-stg-latest}}
    container_name: ${MODEL_CONTAINER_NAME:-warded-model}
    restart: unless-stopped
    pull_policy: ${PULL_POLICY:-missing}
    networks:
      - core-network
    environment:
      - PORT=${MODEL_PORT:-8000}
      - MODEL_DIR=${MODEL_DIR:-/app/models/yolov8n_openvino_320}
      - CV_INPUT_RESOLUTION=${CV_INPUT_RESOLUTION:-}
    deploy:
      resources:
        limits:
          cpus: "${MODEL_CPU_LIMIT:-1.00}"
          memory: "${MODEL_MEMORY_LIMIT:-512M}"
    security_opt:
      - no-new-privileges:true
    volumes:
      - warded-model-weights:/app/models

  warded-harvester:
    profiles: ["harvester"]
    image: python:3.11-slim
    container_name: ${HARVESTER_CONTAINER_NAME:-warded-harvester}
    restart: unless-stopped
    networks:
      - core-network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${HARVESTER_CPU_LIMIT:-0.50}"
          memory: "${HARVESTER_MEMORY_LIMIT:-512M}"
    volumes:
      - warded-stg-data:/app/data
      - ./:/workspace:ro
    working_dir: /workspace
    command: ["python3", "tools/harvester/service.py", "--daemon", "--interval", "300", "--db-path", "/app/data/camera-view.db", "--proof-dir", "/app/data/proofs", "--state-path", "/app/data/harvester_soak_state.json", "--telemetry-out", "/app/data/harvester_soak_status.json"]
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - BACKEND_URL=${BACKEND_URL:-http://warded-backend:3000}
      - CV_ENGINE_URL=${CV_ENGINE_URL:?CV_ENGINE_URL must be provided by the deployment pipeline}
      - DEV_ACCESS_TOKEN=${DEV_ACCESS_TOKEN:-}

  warded-forecast-cron:
    profiles: ["forecast-refit", "forecast-cron"]
    image: python:3.11-slim
    container_name: ${FORECAST_CRON_CONTAINER_NAME:-warded-forecast-cron}
    restart: unless-stopped
    user: "10001:10001"
    networks:
      - core-network
    depends_on:
      warded-init-vol:
        condition: service_completed_successfully
    read_only: true
    init: true
    stop_grace_period: 60s
    volumes:
      - warded-stg-data:/app/data
      - ./:/workspace:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    working_dir: /workspace
    healthcheck:
      test: ["CMD", "python3", "tools/forecast/train_live_model.py", "--health", "--state-file", "/app/data/forecast/refit_state.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command:
      - python3
      - -u
      - tools/forecast/train_live_model.py
      - --daemon
      - --interval
      - "${FORECAST_REFIT_INTERVAL:-21600}"
      - --db
      - /app/data/camera-view.db
      - --features-out
      - /app/data/forecast/features_live_5m.csv
      - --artifact-out
      - /app/data/forecast/prototype_v1.json
      - --report-out
      - /app/data/forecast/forecast_prototype_v1.md
      - --eval-json-out
      - /app/data/forecast/forecast_prototype_v1.json
      - --lock-file
      - /app/data/locks/refit.lock
      - --state-file
      - /app/data/forecast/refit_state.json
      - --telemetry-out
      - /app/data/forecast/refit_status.json
      - --min-new-rows
      - "${FORECAST_MIN_NEW_ROWS:-50}"
      - --promote
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - HOME=/tmp
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Daily SQLite backup to Cloudflare R2. This replaces the removed streaming
  # replication sidecar: tailing the WAL every second meant continuous R2 Class A
  # operations on a Celeron-class host, and it bought an RPO the product does not
  # need. A 24h RPO is accepted, and `sqlite3 .backup` is WAL-safe: it snapshots
  # through the SQLite backup API, so committed frames still sitting in the WAL
  # are captured without a raw file copy that would race the writer.
  warded-backup:
    image: alpine:3.20
    container_name: ${BACKUP_CONTAINER_NAME:-warded-backup}
    restart: unless-stopped
    group_add:
      - "10001"
    # Runs as root with a writable rootfs on purpose: `apk add sqlite rclone
    # tzdata` writes to /lib/apk/db and /usr, which neither a non-root UID nor a
    # read-only rootfs allows. The blast radius is contained by cap_drop: [ALL],
    # no-new-privileges, no published port, and the fact that the only writable
    # mounts are the staging volume and a 32 MB /tmp tmpfs.
    networks:
      - core-network
    depends_on:
      warded-init-vol:
        condition: service_completed_successfully
    volumes:
      # Read-write at the mount level because SQLite opens the database file
      # itself; this container never writes into /app/data.
      - warded-stg-data:/app/data
      # Snapshot and archive staging. A tmpfs cannot hold them: camera-view.db is
      # ~389 MB and tmpfs is RAM, counted against the 128M memory limit.
      - warded-backup-staging:/backup
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      # rclone keeps its scratch state in HOME.
      - HOME=/tmp
      - RCLONE_CONFIG_R2_TYPE=s3
      - RCLONE_CONFIG_R2_PROVIDER=Cloudflare
      - RCLONE_CONFIG_R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - RCLONE_CONFIG_R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      # Bucket-scoped endpoint: a wrong account cannot silently reach AWS S3.
      - RCLONE_CONFIG_R2_ENDPOINT=https://${R2_ACCOUNT_ID:-bb67574163a065e4aad475fb3aa6bb92}.r2.cloudflarestorage.com
      - RCLONE_CONFIG_R2_REGION=${R2_REGION:-auto}
      - BACKUP_BUCKET_NAME=${BACKUP_BUCKET_NAME:-homelab-backup}
      - KEEP_DAYS=${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["/bin/sh", "-c"]
    # No `set -e`: a failed night must log and wait for the next one, not
    # crash-loop. The R2 quota watchdog is the detection path for a stalled
    # backup, so the loop always survives to try again.
    command:
      - |
        set -u
        while ! apk add --no-cache sqlite rclone tzdata >/dev/null 2>&1; do
          echo "[ERR] apk add sqlite rclone tzdata failed; retrying in 300s" >&2
          sleep 300
        done
        echo "[INFO] sqlite, rclone and tzdata installed; TZ=$$TZ"
        while true; do
          wait_s=$(date +%H:%M:%S | awk -F: '{ t = $1 * 3600 + $2 * 60 + $3; target = 3 * 3600 + 15 * 60; printf "%d", (t < target) ? target - t : 86400 - t + target }')
          echo "[INFO] sleeping $${wait_s}s until the next 03:15 $$TZ backup"
          sleep "$$wait_s"
          stamp=$(date +%Y%m%d)
          snapshot=/backup/camera-view.db
          archive="/backup/warded-$${stamp}.sqlite3.gz"
          echo "[INFO] $(date '+%Y-%m-%d %H:%M:%S %Z') starting backup of camera-view.db"
          rm -f "$$snapshot"
          if ! sqlite3 /app/data/camera-view.db ".backup '$$snapshot'"; then
            echo "[ERR] sqlite3 .backup failed for /app/data/camera-view.db" >&2
          elif ! gzip -c "$$snapshot" > "$$archive"; then
            echo "[ERR] gzip failed for $$archive" >&2
          elif ! rclone copyto "$$archive" "r2:$${BACKUP_BUCKET_NAME}/warded/$(basename "$$archive")"; then
            echo "[ERR] rclone upload failed for $$archive to r2:$${BACKUP_BUCKET_NAME}/warded/" >&2
          else
            echo "[INFO] uploaded $$archive to r2:$${BACKUP_BUCKET_NAME}/warded/"
            if rclone delete --min-age "$${KEEP_DAYS}d" "r2:$${BACKUP_BUCKET_NAME}/warded/"; then
              echo "[INFO] retention applied: objects older than $${KEEP_DAYS}d deleted"
            else
              echo "[ERR] rclone retention delete failed; the upload itself is intact" >&2
            fi
          fi
          rm -f "$$snapshot" "$$archive"
          echo "[INFO] backup cycle finished"
          # Step past the 03:15 minute so the next wait computes a full day even
          # when the cycle finished inside the same second it started.
          sleep 61
        done
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "${BACKUP_CPU_LIMIT:-0.10}"
          memory: "${BACKUP_MEMORY_LIMIT:-128M}"

volumes:
  warded-stg-data:
    name: ${DATA_VOLUME_NAME:-warded-stg_warded-stg-data}
  warded-model-weights:
    name: ${MODEL_VOLUME_NAME:-warded-stg_warded-model-weights}
  warded-backup-staging:
    name: ${BACKUP_VOLUME_NAME:-warded-backup-staging}

networks:
  core-network:
    name: ${DOCKER_NETWORK:-core-network}
    external: true
