# Dedicated Docker Compose configuration for the CV Engine on the inference worker host
# Deployed via the container management API configured in CI (see docker-publish.yml)

services:
  warded-cv-engine:
    image: ${MODEL_IMAGE_NAME:-ghcr.io/529-studio/projectkv-model}:${MODEL_IMAGE_TAG:-${IMAGE_TAG:-stg-latest}}
    container_name: ${MODEL_CONTAINER_NAME:-warded-cv-engine}
    restart: unless-stopped
    pull_policy: ${PULL_POLICY:-always}
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MODEL_DIR=/app/models/yolov8n_openvino_320
      - PYTHONUNBUFFERED=1
      # Inference backend. `ort` (ONNX Runtime, CUDA first with CPU fallback) is the
      # default here because this host has a GPU; set CV_BACKEND=openvino to serve
      # the IR at MODEL_DIR through the Intel CPU plugin instead. Both paths are
      # present in the same image, so switching is a restart, not a rebuild.
      - CV_BACKEND=${CV_BACKEND:-ort}
      # Explicit ORT weight path: ORT mode never scans the models directory.
      - CV_ONNX_MODEL=${CV_ONNX_MODEL:-/app/models/yolov8n.onnx}
      # The IR at MODEL_DIR is baked at 320x320. Without this pin the service falls
      # back to its 416 px default whenever the compiled input shape is unreadable,
      # and the CPU plugin then rejects every inference with a PowerStatic Eltwise
      # shape mismatch. Keep the default equal to the model directory's resolution.
      - CV_INPUT_RESOLUTION=${CV_INPUT_RESOLUTION:-320}
    volumes:
      - /home/ubuntu/cv-engine/models:/app/models:ro
    deploy:
      resources:
        limits:
          cpus: "${MODEL_CPU_LIMIT:-2.00}"
          memory: "${MODEL_MEMORY_LIMIT:-2048M}"
        reservations:
          cpus: "${MODEL_CPU_RESERVATION:-1.00}"
          memory: "${MODEL_MEMORY_RESERVATION:-512M}"
