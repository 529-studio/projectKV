      - description: Channel name (e.g. telegram)
        in: query
        name: channel_name
        required: true
        type: string
      - description: Chat ID
        in: query
        name: chat_id
        required: true
        type: string
      - description: Target type (all, chokepoint, zone, ward)
        in: query
        name: target_type
        required: true
        type: string
      - description: Target ID
        in: query
        name: target_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
