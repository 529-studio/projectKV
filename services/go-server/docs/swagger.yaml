        type: boolean
      history_coverage_hours:
        type: number
      last_rain:
        $ref: '#/definitions/harvester.RunRecord'
      last_success_at:
        type: string
      missed_slots:
        items:
          type: string
        type: array
      next_slot:
        type: string
      next_slot_at:
        type: string
      rain_watcher:
        $ref: '#/definitions/harvester.RainWatcherStatus'
      recent_errors:
        items:
          type: string
        type: array
      schedule_slots:
        items:
          type: string
        type: array
      slot_runs:
        additionalProperties:
          $ref: '#/definitions/harvester.RunRecord'
        type: object
      started_at:
        type: string
      totals:
        $ref: '#/definitions/harvester.RunTotals'
    type: object
  hotset.CoverageReport:
    properties:
      bin_interval_minutes:
        type: integer
      camera_id:
        type: string
      cameras_count:
        type: integer
      coverage_ratio:
        type: number
      expected_bins:
        type: integer
      history_coverage_hours:
        type: number
      horizon_eligibility:
        additionalProperties:
          type: boolean
        type: object
      longest_gap_seconds:
        type: integer
      observation_bounds:
        $ref: '#/definitions/hotset.ObservationBounds'
      observed_bins:
        type: integer
      status:
        type: string
      total_observations:
        type: integer
      window:
        type: string
    type: object
  hotset.DirectionalVerdict:
    properties:
      capacity_share:
        type: number
      direction:
        description: '"a" or "b"'
        type: string
      pcu_total:
        type: number
      region_id:
        type: string
      saturation_index:
        type: number
      severity:
        description: '"CLEAR" | "MODERATE" | "HEAVY" | "CONGESTED"'
        type: string
      vehicle_counts:
        $ref: '#/definitions/hotset.VehicleCounts'
      water_ratio:
        type: number
    type: object
  hotset.FloodStatusResponse:
    properties:
      analysis_enabled:
        type: boolean
      app_env:
        type: string
      verdicts:
        items:
          $ref: '#/definitions/hotset.Verdict'
        type: array
    type: object
  hotset.HotsetStatusResponse:
    properties:
      cameras:
        items:
          $ref: '#/definitions/hotset.Verdict'
        type: array
      total:
        type: integer
      updated_at:
        type: string
    type: object
  hotset.ObservationBounds:
    properties:
      earliest:
        type: string
      latest:
        type: string
    type: object
  hotset.TrafficStatusResponse:
    properties:
      analysis_enabled:
        type: boolean
      app_env:
        type: string
      verdicts:
        items:
          $ref: '#/definitions/hotset.Verdict'
        type: array
    type: object
  hotset.VehicleCounts:
    properties:
      bus:
        type: integer
      car:
        type: integer
      container:
        type: integer
      motorcycle:
        type: integer
      truck:
        type: integer
    type: object
  hotset.Verdict:
    properties:
      camera_id:
        type: string
      confidence:
        type: number
      directions:
        items:
          $ref: '#/definitions/hotset.DirectionalVerdict'
        type: array
      flood_calibration_ref:
        type: string
      flood_depth_cm:
        description: |-
          Physical hazard layer (Issue #401, ADR-013 D6).

          Pointers are mandatory: `omitempty` on a bare float64 would erase a measured
          0.0 and make "dry, verified" indistinguishable from "never measured". Because
          TrafficStatusResponse, FloodStatusResponse and HotsetStatusResponse all marshal
          this struct, these five tags carry the fields to every endpoint at once.
        type: number
      flood_depth_confidence:
        type: string
      flood_hazard_basis:
        type: string
      flood_hazard_level:
        description: 1|2|3; nil unknown
        type: integer
      flood_severity:
        description: 'Flood severity: "DRY" | "WET" | "FLOODED_SHALLOW" | "FLOODED_DEEP"
          | "UNKNOWN"'
        type: string
      observed_at:
        type: string
      pcu_total:
        type: number
      saturation_index:
        type: number
      severity:
        description: 'Traffic severity: e.g. "CLEAR" | "MODERATE" | "HEAVY" | "CONGESTED"'
        type: string
      source:
        description: '"mock" | "vlm" | "onnx"'
        type: string
      stale:
        type: boolean
      timestamp:
        type: string
    type: object
  live.FloodHexCell:
    properties:
      camera_count:
        description: qualifying cameras
        type: integer
      flood_severity:
        description: 'worst-of: FLOODED_DEEP > FLOODED_SHALLOW > WET'
        type: string
      h3_id:
        type: string
      polygon:
        description: '[[lat,lng], ...] boundary for rendering'
        items:
          items:
            format: float64
            type: number
          type: array
        type: array
      resolution:
        type: integer
      worst_camera:
        description: camera_id of worst flood verdict
        type: string
      worst_camera_name:
        description: display name
        type: string
    type: object
  live.UserReportSummary:
    properties:
      camera_id:
        type: string
      escalated:
        type: boolean
      expires_at:
        type: string
      latest_at:
        type: string
      report_count:
        type: integer
    type: object
  subscription.ChokepointInfo:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  subscription.SubscribeRequest:
    properties:
      channel_name:
        example: telegram
        type: string
      chat_id:
        example: "123456789"
        type: string
      target_id:
        example: Quận 7 - Nhà Bè
        type: string
      target_type:
        example: zone
        type: string
    required:
    - channel_name
    - chat_id
    - target_type
    type: object
  subscription.TaxonomyResponse:
    properties:
      bot_username:
        description: |-
          BotUsername is the public Telegram handle the web UI turns into a deep
          link. Empty when the bot is unprovisioned; the UI then disables the CTA
          and keeps the manual chat-id form usable (S12-T4 spec §4.3, AC4).
        type: string
      chokepoints:
        items:
          $ref: '#/definitions/subscription.ChokepointInfo'
        type: array
      deep_link_enabled:
        description: |-
          DeepLinkEnabled reports whether the server considers the bot fully
          provisioned (token, username and webhook secret all present and valid).
        type: boolean
      target_types:
        items:
          type: string
        type: array
      wards:
        items:
          $ref: '#/definitions/subscription.WardInfo'
        type: array
      zones:
        items:
          type: string
        type: array
    type: object
  subscription.WardInfo:
    properties:
      name:
        description: e.g. "Bến Nghé", "Thảo Điền"
        type: string
      type:
        description: '"Phường", "Xã", "Thị trấn"'
        type: string
    type: object
  weather.HourlyForecast:
    properties:
      precipitation_probability_percent:
        type: integer
      rain_mm:
        type: number
      time:
        type: string
      weather_code:
        type: integer
      weather_desc_en:
        type: string
      weather_desc_vi:
        type: string
    type: object
  weather.RadarFrame:
    properties:
      path:
        type: string
      time:
        type: integer
    type: object
  weather.RadarMetadata:
    properties:
      generated:
        type: integer
      host:
        type: string
      latest_tile_template:
        type: string
      nowcast_frames:
        items:
          $ref: '#/definitions/weather.RadarFrame'
        type: array
      past_frames:
        items:
          $ref: '#/definitions/weather.RadarFrame'
        type: array
      source:
        type: string
      updated_at:
        type: string
    type: object
  weather.WeatherData:
    properties:
      apparent_temperature_c:
        type: number
      hourly_forecast:
        items:
          $ref: '#/definitions/weather.HourlyForecast'
        type: array
      humidity_percent:
        type: integer
      latitude:
        type: number
      location:
        type: string
      longitude:
        type: number
      precipitation_probability_percent:
        type: integer
      rain_mm:
        type: number
      source:
        type: string
      temperature_c:
        type: number
      updated_at:
        type: string
      weather_code:
        type: integer
      weather_desc_en:
        type: string
      weather_desc_vi:
        type: string
    type: object
info:
  contact: {}
  description: Ho Chi Minh City Traffic Camera & Flood Alert API
  title: Camera View API
  version: "1.0"
paths:
  /api/archiver/dates:
    get:
      description: Retrieve a list of dates that contain archived snapshot proof frames
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List available partition dates
      tags:
      - archiver
  /api/archiver/labels:
    get:
      description: Retrieve saved human labels for a given partition date
      parameters:
      - description: Partition date in YYYY-MM-DD format
        in: query
        name: date
        type: string
      - description: Filter by camera ID
        in: query
        name: camera_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/archiver.LabelListResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List ground truth labels for date
      tags:
      - archiver
    post:
      consumes:
      - application/json
      description: 'Record ground truth label for flood, traffic, weather, time of
        day, and optional segmentation polygons (annotations with normalized [0,1]
        coordinates, canonical classes: roadway, water_puddle, motorcycle, car, bus,
        truck)'
      parameters:
      - description: Label annotation payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/archiver.LabelPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Save human annotation label for a snapshot
      tags:
      - archiver
  /api/archiver/snapshots:
    get:
      description: Browse archived frames for a specific partition date with optional
        camera filter and pagination
      parameters:
      - description: Partition date in YYYY-MM-DD format (defaults to today or latest)
        in: query
        name: date
        type: string
      - description: Filter by camera ID
        in: query
        name: camera_id
        type: string
      - description: Maximum number of snapshots to return (1-200, default 50)
        in: query
        name: limit
        type: integer
      - description: Offset for pagination (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/archiver.SnapshotListResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List archived snapshot frames
      tags:
      - archiver
  /api/archiver/snapshots/raw:
    get:
      description: Secure proxy stream of raw JPEG snapshot binary, protecting against
        path traversal and bypassing Zero Trust redirects
      parameters:
      - description: Snapshot storage key
        in: query
        name: key
        required: true
        type: string
      produces:
      - image/jpeg
      responses:
        "200":
          description: OK
