            type: array
      summary: Snapshot of all active flood hex cells
      tags:
      - Flood
  /api/flood-status:
    get:
      description: Returns the most recent AI-analyzed flood and rain verdicts for
        cameras in the Hot Set along with analysis_enabled status. When APP_ENV is
        not dev, verdicts with source=mock are strictly omitted. Unverified cameras
        are omitted per honesty rules.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hotset.FloodStatusResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get latest flood-detection verdicts
      tags:
      - Flood
  /api/flood/user-reports:
    get:
      description: Returns the snapshot of all cameras currently having active user
        flood reports within the 15-minute sliding window.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/live.UserReportSummary'
            type: array
      summary: Snapshot of all active crowdsourced user flood reports
      tags:
      - Flood
  /api/health:
    get:
      description: Liveness and readiness probe reporting system, schema and cv-engine
