      - Subscriptions
  /api/tiles/{z}/{x}/{y}:
    get:
      description: Serves high-contrast dark raster tiles (PNG) cached on local disk
        with 30-day immutable HTTP cache headers. The upstream is configurable through
        MAP_TILE_UPSTREAM_URL (CARTO Dark Matter is opt-in with MAP_TILE_API_KEY);
        light upstreams are darkened server-side unless MAP_TILE_DARKEN=0.
      parameters:
      - description: Zoom level (0-19)
        in: path
        name: z
        required: true
        type: integer
      - description: X coordinate
        in: path
        name: x
        required: true
        type: integer
      - description: Y coordinate (with or without .png extension)
        in: path
        name: "y"
        required: true
        type: string
      produces:
      - image/png
      responses:
        "200":
          description: PNG image data
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get map tile (cached proxy)
      tags:
      - Map
  /api/traffic-status:
    get:
