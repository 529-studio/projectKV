  forecast.HorizonPrediction:
    properties:
      confidence:
        type: number
      confidence_intervals:
        $ref: '#/definitions/forecast.ConfidenceIntervals'
      horizon_minutes:
        type: integer
      predicted_saturation_index:
        type: number
      predicted_severity:
        type: string
      predicted_speed_kmh:
        type: number
      target_time:
        type: string
    type: object
  forecast.Interval:
    properties:
      lower_95:
        type: number
      upper_95:
        type: number
    type: object
  forecast.ModelMetadata:
    properties:
      artifact_sha256:
        type: string
      experimental:
        type: boolean
      fit_cameras:
        type: integer
      fit_data_sha256:
        type: string
      fit_rows:
        type: integer
      fit_source:
        type: string
      fit_window:
        $ref: '#/definitions/forecast.FitWindow'
      mae:
        type: number
      metrics:
        items:
          $ref: '#/definitions/forecast.HorizonMetric'
        type: array
      name:
        type: string
      sha256:
        type: string
      target_mode:
        type: string
      validated:
        type: boolean
      version:
        type: string
    type: object
  forecast.MultiHorizonResponse:
    properties:
      availability:
        $ref: '#/definitions/forecast.AvailabilityStatus'
      base_time:
        type: string
      camera_id:
        type: string
      current:
        $ref: '#/definitions/forecast.CurrentCondition'
      experimental:
