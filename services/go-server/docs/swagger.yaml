      responses:
        "200":
          description: JPEG image data
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get camera snapshot (proxy cache)
      tags:
      - Camera
  /api/subscriptions:
    delete:
