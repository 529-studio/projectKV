  /api/v1/hotset/history/coverage:
    get:
      description: Reports observation bounds, 10m bin counts, coverage ratio, longest
        gap, and per-horizon prediction eligibility across a trailing window (default
        72h).
      parameters:
      - description: Camera ID (empty for aggregate across all cameras)
        in: query
        name: camera_id
        type: string
      - description: Time window duration (e.g. 72h, 24h, 60m; default 72h)
        in: query
        name: window
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
