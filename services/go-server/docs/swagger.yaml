basePath: /
definitions:
  camera.Camera:
    properties:
      displayName:
        type: string
      duplicateOf:
        type: string
      h3_res7:
        type: string
      h3_res9:
        type: string
      id:
        type: string
      isGhost:
        type: boolean
      isOnline:
        type: boolean
      latitude:
        type: number
      longitude:
        type: number
      phuong_id:
        type: string
      phuong_name:
        type: string
      phuong_type:
        type: string
      road_key:
        type: string
      road_keys:
        items:
          type: string
        type: array
      road_name:
        type: string
      road_type:
        type: string
      snapshotUrl:
        type: string
      status:
        type: string
      title:
        type: string
      zone:
        type: string
    type: object
  camera.Phuong:
    properties:
      name:
        type: string
      type:
        type: string
    type: object
  corridor.CameraVerdict:
    properties:
      camera_id:
        type: string
      confidence:
        type: number
      flood_severity:
        type: string
      name:
        type: string
      observed_at:
        type: string
      severity:
        description: '"CLEAR" | "MODERATE" | "HEAVY" | "CONGESTED" | "UNKNOWN"'
        type: string
      source:
        type: string
      stale:
        type: boolean
    type: object
  corridor.CorridorStatus:
    properties:
      cameras:
        items:
          $ref: '#/definitions/corridor.CameraVerdict'
        type: array
      coverage_pct:
        type: number
      oldest_observation_age_s:
        type: integer
      road_key:
        type: string
      total_cameras:
        type: integer
      verified_cameras:
        type: integer
      worst_severity:
        description: '"CLEAR" | "MODERATE" | "HEAVY" | "CONGESTED" | "UNKNOWN"'
        type: string
    type: object
  corridor.RoadSummary:
    properties:
      camera_count:
        type: integer
      road_key:
        type: string
    type: object
  corridor.RoadsResponse:
    properties:
      roads:
        items:
          $ref: '#/definitions/corridor.RoadSummary'
        type: array
      total:
        type: integer
    type: object
  hotset.FloodStatusResponse:
    properties:
      analysis_enabled:
        type: boolean
      app_env:
        type: string
      verdicts:
        items:
          $ref: '#/definitions/hotset.Verdict'
        type: array
    type: object
  hotset.TrafficStatusResponse:
    properties:
      analysis_enabled:
        type: boolean
      app_env:
        type: string
      verdicts:
        items:
          $ref: '#/definitions/hotset.Verdict'
        type: array
    type: object
  hotset.Verdict:
    properties:
      camera_id:
        type: string
      confidence:
        type: number
      flood_severity:
        description: 'Flood severity: "DRY" | "WET" | "FLOODED_SHALLOW" | "FLOODED_DEEP"
          | "UNKNOWN"'
        type: string
      observed_at:
        type: string
      severity:
        description: 'Traffic severity: e.g. "CLEAR" | "MODERATE" | "HEAVY" | "CONGESTED"'
        type: string
      source:
        description: '"mock" | "vlm" | "onnx"'
        type: string
      stale:
        type: boolean
      timestamp:
        type: string
    type: object
  live.FloodHexCell:
    properties:
      camera_count:
        description: qualifying cameras
        type: integer
      flood_severity:
        description: 'worst-of: FLOODED_DEEP > FLOODED_SHALLOW > WET'
        type: string
      h3_id:
        type: string
      polygon:
        description: '[[lat,lng], ...] boundary for rendering'
        items:
          items:
            format: float64
            type: number
          type: array
        type: array
      resolution:
        type: integer
      worst_camera:
        description: camera_id of worst flood verdict
        type: string
      worst_camera_name:
        description: display name
        type: string
    type: object
  weather.HourlyForecast:
    properties:
      precipitation_probability_percent:
        type: integer
      rain_mm:
        type: number
      time:
        type: string
      weather_code:
        type: integer
      weather_desc_en:
        type: string
      weather_desc_vi:
        type: string
    type: object
  weather.RadarFrame:
    properties:
      path:
        type: string
      time:
        type: integer
    type: object
  weather.RadarMetadata:
    properties:
      generated:
        type: integer
      host:
        type: string
      latest_tile_template:
        type: string
      nowcast_frames:
        items:
          $ref: '#/definitions/weather.RadarFrame'
        type: array
      past_frames:
        items:
          $ref: '#/definitions/weather.RadarFrame'
        type: array
      source:
        type: string
      updated_at:
        type: string
    type: object
  weather.WeatherData:
    properties:
      apparent_temperature_c:
        type: number
      hourly_forecast:
        items:
          $ref: '#/definitions/weather.HourlyForecast'
        type: array
      humidity_percent:
        type: integer
      latitude:
        type: number
      location:
        type: string
      longitude:
        type: number
      precipitation_probability_percent:
        type: integer
      rain_mm:
        type: number
      source:
        type: string
      temperature_c:
        type: number
      updated_at:
        type: string
      weather_code:
        type: integer
      weather_desc_en:
        type: string
      weather_desc_vi:
        type: string
    type: object
info:
  contact: {}
  description: Ho Chi Minh City Traffic Camera & Flood Alert API
  title: Camera View API
  version: "1.0"
paths:
  /api/cameras:
    get:
      description: Retrieve full camera catalog with optional zone, corridor, and
        phuong filters
      parameters:
      - description: Filter by administrative or geographic zone
        in: query
        name: zone
        type: string
      - description: Filter by corridor keyword
        in: query
        name: corridor
        type: string
      - description: Filter by post-reform Phường name
        in: query
        name: phuong
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/camera.Camera'
            type: array
      summary: List cameras
      tags:
      - Camera
  /api/cameras/{id}:
    get:
      description: Retrieve single camera metadata by its unique identifier
      parameters:
      - description: Camera ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/camera.Camera'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get camera by ID
      tags:
      - Camera
  /api/cameras/snapshot/{id}:
    get:
      description: Proxy and cache real-time traffic camera snapshot image from upstream
        portal
      parameters:
      - description: Camera ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - image/jpeg
      responses:
        "200":
          description: JPEG image data
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get camera snapshot image
      tags:
      - Camera
  /api/config:
    get:
      description: Returns lightweight runtime configuration including whether AI
        analysis is enabled.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get system analysis configuration
      tags:
      - System
  /api/flood-hex:
    get:
      description: Returns the snapshot of all currently active H3 hexagonal cells
        with qualifying flood observations for immediate client hydration on startup.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/live.FloodHexCell'
            type: array
      summary: Snapshot of all active flood hex cells
      tags:
      - Flood
  /api/flood-status:
    get:
      description: Returns the most recent AI-analyzed flood and rain verdicts for
        cameras in the Hot Set along with analysis_enabled status. When APP_ENV is
        not dev, verdicts with source=mock are strictly omitted. Unverified cameras
        are omitted per honesty rules.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hotset.FloodStatusResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get latest flood-detection verdicts
      tags:
      - Flood
  /api/live/stream:
    get:
      description: 'Server-Sent Events (SSE) stream delivering real-time Hot Set verdict
        updates and H3 hex cell aggregations. Emits ''camera_update'' and ''hex_update''
        events with JSON payloads and periodic heartbeat comments (: heartbeat).'
      produces:
      - text/event-stream
      responses:
        "200":
          description: text/event-stream stream
          schema:
            type: string
      summary: Real-time camera verdict and hex cell SSE stream
      tags:
      - Live
  /api/phuong:
    get:
      description: Retrieve sorted list of distinct post-reform Phường structured
        pairs
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/camera.Phuong'
            type: array
      summary: List camera wards (Phường)
      tags:
      - Camera
  /api/roads:
    get:
      description: Returns list of all known road keys with associated camera counts,
        sorted by camera density descending.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/corridor.RoadsResponse'
      summary: List all known road keys
      tags:
      - Corridor
  /api/roads/{road_key}/status:
    get:
      description: Returns the aggregated traffic status for a named road corridor
        identified by road_key, including worst severity, coverage percentage, oldest
        observation age, and per-camera verdicts. Enforces ADR-004 §D4 honesty rules.
      parameters:
      - description: Road Key identifier (e.g. vo_van_kiet, quoc_lo_1)
        in: path
        name: road_key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/corridor.CorridorStatus'
        "404":
          description: Corridor not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get corridor traffic status
      tags:
      - Corridor
  /api/snapshot/{id}:
    get:
      description: Proxy and cache a real-time traffic camera snapshot from the upstream
        DOT portal (TTL ≥ 10 s). Also triggers HotSet Touch for automatic AI analysis.
      parameters:
      - description: Camera ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - image/jpeg
      responses:
        "200":
          description: JPEG image data
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get camera snapshot (proxy cache)
      tags:
      - Camera
  /api/tiles/{z}/{x}/{y}:
    get:
      description: Serves OpenStreetMap raster tiles (PNG) cached on local disk with
        30-day immutable HTTP cache headers.
      parameters:
      - description: Zoom level (0-19)
        in: path
        name: z
        required: true
        type: integer
      - description: X coordinate
        in: path
        name: x
        required: true
        type: integer
      - description: Y coordinate (with or without .png extension)
        in: path
        name: "y"
        required: true
        type: string
      produces:
      - image/png
      responses:
        "200":
          description: PNG image data
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get map tile (cached proxy)
      tags:
      - Map
  /api/traffic-status:
    get:
      description: Returns the most recent AI-analyzed congestion verdict for cameras
        in the Hot Set along with analysis_enabled status. When APP_ENV is not dev,
        verdicts with source=mock are strictly omitted.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hotset.TrafficStatusResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get latest traffic congestion verdicts
      tags:
      - Traffic
  /api/weather:
    get:
      description: Returns current temperature, humidity, WMO weather condition code,
        hourly rain probability, and precipitation volume from Open-Meteo with in-memory
        caching.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/weather.WeatherData'
        "500":
          description: Internal server error fetching weather data
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get live meteorological weather & rain forecast for Ho Chi Minh City
      tags:
      - Weather
  /api/weather/radar:
    get:
      description: Returns the latest radar frame timestamps, host, and tile URL template
        for rendering live precipitation radar layers in Leaflet.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/weather.RadarMetadata'
        "500":
          description: Internal server error fetching radar metadata
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get live RainViewer Doppler radar tile metadata
      tags:
      - Weather
  /api/zones:
    get:
      description: Retrieve sorted list of valid camera zone identifiers
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
      summary: List camera zones
      tags:
      - Camera
  /healthz:
    get:
      description: Liveness and readiness probe
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - System
swagger: "2.0"
