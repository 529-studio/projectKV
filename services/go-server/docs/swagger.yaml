basePath: /
definitions:
  archiver.LabelListResponse:
    properties:
      date:
        type: string
      labels:
        items:
          $ref: '#/definitions/archiver.LabelPayload'
        type: array
      total:
        type: integer
    type: object
  archiver.LabelPayload:
    properties:
      annotations:
        description: segmentation polygons (normalized [0,1])
        items:
          $ref: '#/definitions/archiver.PolygonAnnotation'
        type: array
      annotator:
        type: string
      camera_id:
        type: string
      date:
        type: string
      flood_level:
        description: none, puddle/shallow, deep
        type: string
      flood_submersion_anchor:
        description: dry, wet_asphalt_no_standing, tire_base_under_10cm, exhaust_hub_over_15cm
        type: string
      notes:
        type: string
      quality_tags:
        description: rain_on_lens, night_glare, occluded, signal_noise
        items:
          type: string
        type: array
      queue_reason:
        description: free_flow, traffic_light, bottleneck, flood_barrier, accident
        type: string
      snapshot_key:
        type: string
      time_of_day:
        description: day, dusk, night
        type: string
      timestamp:
        type: integer
      traffic_dir_a:
        description: CLEAR, MODERATE, HEAVY, CONGESTED
        type: string
      traffic_dir_b:
        description: CLEAR, MODERATE, HEAVY, CONGESTED, NOT_APPLICABLE
        type: string
      traffic_level:
        description: clear, moderate, heavy, gridlock/congested
        type: string
      weather:
        description: clear/dry, rain, heavy_rain/fog
        type: string
    required:
    - camera_id
    - date
    - snapshot_key
    type: object
  archiver.PolygonAnnotation:
    properties:
      class:
        description: 'canonical: roadway, water_puddle, motorcycle, car, bus, truck'
        type: string
      direction:
        description: 'optional: "a" | "b" (valid only when class == roadway)'
        type: string
      polygon:
        description: '[[x, y], ...] normalized to [0, 1]'
        items:
          items:
            format: float64
            type: number
          type: array
        type: array
      source:
        description: 'provenance: "human" | "sam_prelabel" | model id'
        type: string
    type: object
  archiver.SnapshotItem:
    properties:
      camera_id:
        type: string
      camera_name:
        type: string
      key:
        type: string
      raw_url:
        type: string
      reason:
        type: string
      size:
        type: integer
      timestamp:
        type: integer
    type: object
  archiver.SnapshotListResponse:
    properties:
      date:
        type: string
      limit:
        type: integer
      offset:
        type: integer
      snapshots:
        items:
          $ref: '#/definitions/archiver.SnapshotItem'
        type: array
      total:
        type: integer
    type: object
  camera.Camera:
    properties:
      base_capacity:
        type: number
      direction_coverage:
        type: string
      displayName:
        type: string
      duplicateOf:
        type: string
      h3_res7:
        type: string
      h3_res9:
        type: string
      id:
        type: string
      isGhost:
        type: boolean
      isOnline:
        type: boolean
      isWaterway:
        type: boolean
      latitude:
        type: number
      longitude:
        type: number
      phuong_id:
        type: string
      phuong_name:
        type: string
      phuong_type:
        type: string
      regions:
        items:
          $ref: '#/definitions/camera.RoadwayRegion'
        type: array
      road_key:
        type: string
      road_keys:
        items:
          type: string
        type: array
      road_name:
        type: string
      road_type:
        type: string
      snapshotUrl:
        type: string
      status:
        type: string
      title:
        type: string
      zone:
        type: string
    type: object
  camera.Phuong:
    properties:
      name:
        type: string
      type:
        type: string
    type: object
  camera.RoadwayRegion:
    properties:
      capacity_share:
        type: number
      direction:
        description: '"a" (approaching/near) or "b" (receding/far)'
        type: string
      polygon:
        description: Normalized [[x, y], ...] in [0, 1] range
        items:
          items:
            format: float64
            type: number
          type: array
        type: array
      region_id:
        type: string
    type: object
  corridor.CameraVerdict:
    properties:
      camera_id:
        type: string
      confidence:
        type: number
      flood_severity:
        type: string
      name:
        type: string
      observed_at:
        type: string
      severity:
        description: '"CLEAR" | "MODERATE" | "HEAVY" | "CONGESTED" | "UNKNOWN"'
        type: string
      source:
        type: string
      stale:
        type: boolean
    type: object
  corridor.CorridorStatus:
    properties:
      cameras:
        items:
          $ref: '#/definitions/corridor.CameraVerdict'
        type: array
      coverage_pct:
        type: number
      oldest_observation_age_s:
        type: integer
      road_key:
        type: string
      total_cameras:
        type: integer
      verified_cameras:
        type: integer
      worst_severity:
        description: '"CLEAR" | "MODERATE" | "HEAVY" | "CONGESTED" | "UNKNOWN"'
        type: string
    type: object
  corridor.RoadSummary:
    properties:
      camera_count:
        type: integer
      road_key:
        type: string
    type: object
  corridor.RoadsResponse:
    properties:
      roads:
        items:
          $ref: '#/definitions/corridor.RoadSummary'
        type: array
      total:
        type: integer
    type: object
  feedback.ErrorResponse:
    properties:
      error:
        example: rate_limited
        type: string
      message:
        example: Too many reports for this camera. Please try again later.
        type: string
      retry_after_seconds:
        example: 300
        type: integer
    type: object
  feedback.ReportResponse:
    properties:
      camera_id:
        example: 586e2995f9fab7001111b0b5
        type: string
      message:
        example: Ghi nhận phản ánh ngập thành công
        type: string
      status:
        example: success
        type: string
      timestamp:
        type: string
    type: object
  flood.FloodVerificationResult:
    properties:
      camera_id:
        type: string
      camera_name:
        type: string
      confidence:
        type: number
      description:
        type: string
      flood_severity:
        type: string
      quota_remaining_day:
        type: integer
      quota_remaining_minute:
        type: integer
      source:
        type: string
      verified_at:
        type: string
    type: object
  flood.QuotaStatus:
    properties:
      current_day:
        type: string
      last_verified_at:
        type: string
      limit_rpd:
        type: integer
      limit_rpm:
        type: integer
      remaining_rpd:
        type: integer
      remaining_rpm:
        type: integer
    type: object
  forecast.AvailabilityStatus:
    enum:
    - ok
    - insufficient_history
    - model_unvalidated
    - stale
    - ok
    - insufficient_history
    - model_unvalidated
    - stale
    type: string
    x-enum-varnames:
    - StatusOk
    - StatusInsufficientHistory
    - StatusModelUnvalidated
    - StatusStale
    - AvailabilityOK
    - AvailabilityInsufficientHistory
    - AvailabilityModelUnvalidated
    - AvailabilityStale
  forecast.ConfidenceIntervals:
    properties:
      saturation_index:
        $ref: '#/definitions/forecast.Interval'
      speed_kmh:
        $ref: '#/definitions/forecast.Interval'
    type: object
  forecast.CurrentCondition:
    properties:
      confidence:
        type: number
      observed_at:
        type: string
      saturation_index:
        type: number
      severity:
        type: string
      speed_kmh:
        type: number
    type: object
  forecast.ErrorKind:
    enum:
    - invalid_parameter
    - not_found
    - insufficient_history
    - model_unvalidated
    - service_unavailable
    type: string
    x-enum-varnames:
    - KindInvalidParameter
    - KindNotFound
    - KindInsufficientHistory
    - KindModelUnvalidated
    - KindServiceUnavailable
  forecast.ErrorResponse:
    properties:
      availability:
        $ref: '#/definitions/forecast.AvailabilityStatus'
      error:
        $ref: '#/definitions/forecast.ErrorKind'
      message:
        type: string
      model:
        $ref: '#/definitions/forecast.ModelMetadata'
      requirements:
        $ref: '#/definitions/forecast.Requirements'
    type: object
  forecast.FitWindow:
    properties:
