      generated_at:
        type: string
      horizons:
        items:
          $ref: '#/definitions/forecast.HorizonPrediction'
        type: array
      model:
        $ref: '#/definitions/forecast.ModelMetadata'
      road_key:
        type: string
      source_data:
        $ref: '#/definitions/forecast.SourceData'
    type: object
  forecast.Requirements:
    properties:
      min_observations:
        type: integer
      observed_samples:
