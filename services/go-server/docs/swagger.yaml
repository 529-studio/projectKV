        type: number
      last_observed_at:
        type: string
      sample_count:
        type: integer
      stale:
        type: boolean
      window_minutes:
        type: integer
    type: object
  harvester.RainWatcherStatus:
    properties:
      cooldown_minutes:
        type: integer
      enabled:
        type: boolean
      last_trigger_at:
        type: string
    type: object
  harvester.RunRecord:
    properties:
      duration_ms:
        type: integer
      error:
        type: string
      failed:
        type: integer
      harvested:
        type: integer
      scope:
