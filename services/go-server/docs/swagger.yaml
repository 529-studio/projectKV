      parameters:
      - description: Channel name (e.g. telegram)
        in: query
        name: channel_name
        required: true
        type: string
      - description: Chat ID
        in: query
        name: chat_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List flood alert subscriptions
      tags:
      - Subscriptions
    post:
      consumes:
      - application/json
      description: 'Subscribes a user chat ID on a channel (e.g. Telegram) to flood
        alerts (scope: all, chokepoint, zone, or ward).'
      parameters:
      - description: Subscription details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/subscription.SubscribeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create flood alert subscription
      tags:
      - Subscriptions
  /api/subscriptions/taxonomy:
