      description: Returns short-horizon congestion forecasts (10, 20, 30 min) for
        a camera segment using Ridge delta regression or baseline models.
      parameters:
      - description: Camera ID
        in: path
        name: id
        required: true
        type: string
      - description: Base timestamp in RFC3339 format (default current UTC)
        in: query
        name: timestamp
        type: string
      - description: Model selector (ridge_delta, persistence, historical_median;
          default ridge_delta)
        in: query
        name: model
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/forecast.MultiHorizonResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/forecast.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/forecast.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/forecast.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/forecast.ErrorResponse'
      summary: Short-horizon congestion forecast
      tags:
      - Forecast
      - Traffic
